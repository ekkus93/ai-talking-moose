[package]
name = "talking-moose-kittentts-p0"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "=1.0.100"
libc = "=0.2.175"
once_cell = "=1.21.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-23"] }
piper-plus-g2p = { version = "=0.4.0", default-features = false, features = ["english"] }
regex = "=1.13.1"
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.145"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
