[package]
name = "talking-moose-ai"
default-run = "talking-moose-ai"
version = "0.1.0"
description = "Talking Moose AI Desktop Character"
authors = ["Talking Moose Team"]
edition = "2021"

[features]
frontend-contract-export = []

[[bin]]
name = "export_frontend_contract"
path = "src/bin/export_frontend_contract.rs"
required-features = ["frontend-contract-export"]

[lib]
name = "talking_moose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
cpal = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots", "connect"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
libc = "0.2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tauri = { version = "2.1", features = ["test"] }
tempfile = "3.10"

[target.'cfg(target_os = "macos")'.dependencies]
av-foundation = "0.8.1"
security-framework = "3.7"
security-framework-sys = "2.17"
