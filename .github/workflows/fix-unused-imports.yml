name: One-shot unused import repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-unused-imports.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unused imports
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/use tracing::{info, warn};/use tracing::info;/' src-tauri/src/ai/google/live.rs
          sed -i 's/use crate::ai::traits::{LiveSession, RealtimeConversationProvider};/use crate::ai::traits::RealtimeConversationProvider;/' src-tauri/src/commands/settings.rs
          ! grep -F 'use tracing::{info, warn};' src-tauri/src/ai/google/live.rs
          ! grep -F 'use crate::ai::traits::{LiveSession, RealtimeConversationProvider};' src-tauri/src/commands/settings.rs
          rm .github/workflows/fix-unused-imports.yml
          git diff --check

      - name: Commit repair to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/ai/google/live.rs src-tauri/src/commands/settings.rs .github/workflows/fix-unused-imports.yml
          git commit -m 'fix: remove unused Gemini imports'
          git push origin HEAD:master
