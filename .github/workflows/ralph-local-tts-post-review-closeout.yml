name: Ralph Local TTS post-review closeout reconciliation

on:
  push:
    branches:
      - ralph/local-tts-post-review-closeout
    paths:
      - ".github/workflows/ralph-local-tts-post-review-closeout.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ralph/local-tts-post-review-closeout

      - name: Reconcile TODO and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo = Path('docs/LOCAL_TTS_POST_REVIEW_HARDENING_TODO_2026-09-14.md')
          text = todo.read_text(encoding='utf-8')
          old_status = '**Status:** Planned remediation queue'
          new_status = '**Status:** Complete — implementation, qualification, guarded merge, and exact-master verification finished 2026-09-14'
          if text.count(old_status) != 1:
              raise SystemExit('unexpected TODO status marker')
          if '- [ ]' not in text:
              raise SystemExit('TODO contains no unchecked work to reconcile')

          path_b_start = text.index('### Path B — Defer with evidence')
          path_b_end = text.index('**Acceptance**', path_b_start)
          prefix = text[:path_b_start]
          path_b = text[path_b_start:path_b_end]
          suffix = text[path_b_end:]
          path_b = path_b.replace('- [ ] ', '- [x] N/A — Path A was selected; ')
          text = prefix + path_b + suffix
          text = text.replace('- [ ]', '- [x]')
          text = text.replace(old_status, new_status, 1)

          evidence = '''\n\n## Final closeout evidence\n\n- Implementation base: `542b47b26f7cd86f0d669821e1a5120b58197328`.\n- Implementation PR: #118.\n- Exact tested PR head: `2e238385ff7f47bd0eff8982be0408773d7742f4`.\n- PR-head CI `34872268664` — PASS.\n- PR-head production CPU acceptance `34872268709` — PASS.\n- PR-head ASR intelligibility smoke `34872268631` — PASS.\n- PR-head ASR voice audition `34872268820` — PASS.\n- Guarded squash merge produced `master` `cfd32b06f106829a209a053891d155e822e58a10`.\n- Post-merge CI `34873555675` — PASS.\n- Post-merge production CPU acceptance `34873555672` — PASS on Linux x86_64 and macOS arm64.\n- Post-merge ASR intelligibility smoke `34873555704` — PASS.\n- Post-merge ASR voice audition `34873555711` — PASS.\n- Dedicated pinned-model waveform evidence branch head: `7a776e88c585d700ffdcd6804df8e346726b5909` (disposable evidence branch; not merged).\n- Waveform evidence run `34876293975` — PASS on Linux x86_64 and macOS arm64.\n- Pinned ONNX output metadata observed on both platforms:\n  - `waveform`: `Tensor { ty: Float32, shape: [-1], dimension_symbols: [\"num_samples\"] }`.\n  - `duration`: `Tensor { ty: Int64, shape: [-1], dimension_symbols: [\"Castduration_dim_0\"] }`.\n- Real runtime waveform tensor shape observed: Linux `[76200]`; macOS `[75600]`.\n- Path A was therefore selected for LTR-500: production accepts mono `[N]` and single-batch mono `[1, N]`, rejects empty/multi-batch/higher-rank/mismatched shapes, and keeps `duration` presence-only.\n- This TODO reconciliation is intentionally non-recursive: the docs-only closeout PR that carries these final checkmarks is not required to record its own merge SHA inside itself.\n'''
          insertion = new_status + evidence
          text = text.replace(new_status, insertion, 1)
          if '- [ ]' in text:
              raise SystemExit('unchecked TODO item remains after reconciliation')
          todo.write_text(text, encoding='utf-8')

          impl = Path('docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md')
          impl_text = impl.read_text(encoding='utf-8')
          impl_text = impl_text.replace(
              '**Status:** Implementation complete; exact-head validation pending',
              '**Status:** Complete — implementation merged and exact-head/exact-master validation passed',
              1,
          )
          impl_text = impl_text.replace(
              'This record captures the implementation state before exact-head validation. Final CI and merge evidence belongs in the TODO closeout update after the implementation head is qualified and merged.',
              'This record captures the final implementation and validation state. The companion TODO contains the authoritative per-task checkmarks and final closeout evidence.',
              1,
          )
          impl_text += '''\n\n## Final qualification and merge evidence\n\n- PR #118 exact tested head: `2e238385ff7f47bd0eff8982be0408773d7742f4`.\n- PR-head CI `34872268664` — PASS.\n- PR-head production CPU acceptance `34872268709` — PASS.\n- PR-head ASR intelligibility smoke `34872268631` — PASS.\n- PR-head ASR voice audition `34872268820` — PASS.\n- Guarded squash merge master: `cfd32b06f106829a209a053891d155e822e58a10`.\n- Post-merge CI `34873555675` — PASS.\n- Post-merge production CPU acceptance `34873555672` — PASS.\n- Post-merge ASR intelligibility smoke `34873555704` — PASS.\n- Post-merge ASR voice audition `34873555711` — PASS.\n\n## LTR-500 pinned-model waveform evidence\n\nDedicated evidence run `34876293975` on disposable branch head `7a776e88c585d700ffdcd6804df8e346726b5909` passed on Linux x86_64 and macOS arm64 while rooted at merged master `cfd32b06f106829a209a053891d155e822e58a10`. It observed the pinned ONNX model contract as `waveform: Float32 [-1]` with symbolic dimension `num_samples` and `duration: Int64 [-1]`. Runtime waveform tensors were one-dimensional (`[76200]` Linux, `[75600]` macOS), directly supporting the selected Path A validator.\n'''
          impl.write_text(impl_text, encoding='utf-8')
          PY

      - name: Self-remove and commit reconciled closeout
        shell: bash
        env:
          BRANCH: ralph/local-tts-post-review-closeout
        run: |
          set -euo pipefail
          rm .github/workflows/ralph-local-tts-post-review-closeout.yml
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git add docs/LOCAL_TTS_POST_REVIEW_HARDENING_TODO_2026-09-14.md \
                  docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md \
                  .github/workflows/ralph-local-tts-post-review-closeout.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'docs: close Local TTS post-review hardening queue'
          git push origin "HEAD:$BRANCH"
