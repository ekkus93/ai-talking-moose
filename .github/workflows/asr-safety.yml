name: ASR Rust Safety

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/moonshine/ffi.rs"
      - "src-tauri/src/asr/moonshine/manifest.rs"
      - "src-tauri/src/asr/moonshine/runtime.rs"
      - "tools/asr-miri/**"
      - ".github/workflows/asr-safety.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/moonshine/ffi.rs"
      - "src-tauri/src/asr/moonshine/manifest.rs"
      - "src-tauri/src/asr/moonshine/runtime.rs"
      - "tools/asr-miri/**"
      - ".github/workflows/asr-safety.yml"

permissions:
  contents: read

concurrency:
  group: asr-rust-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Moonshine wrapper + transcript boundary under Miri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIRI_TOOLCHAIN: nightly-2026-08-22
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned nightly Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri

      - name: Prepare Miri sysroot
        run: cargo +"$MIRI_TOOLCHAIN" miri setup

      - name: Run production Moonshine wrapper tests under Miri
        run: cargo +"$MIRI_TOOLCHAIN" miri test --manifest-path tools/asr-miri/Cargo.toml
