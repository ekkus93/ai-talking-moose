name: Wake Word runtime identity freeze
on:
  push:
    branches: [master]
    paths:
      - "scripts/freeze_wake_word_runtime_identity.py"
      - "scripts/prepare_wake_word_runtime.py"
      - "tests/test_wake_word_runtime_artifacts.py"
      - "wake-word-artifacts.json"
      - "docs/licenses/SHERPA_ONNX_RUNTIME_NOTICE.md"
      - ".github/workflows/wake-word-runtime-identity.yml"
  pull_request:
    paths:
      - "scripts/freeze_wake_word_runtime_identity.py"
      - "scripts/prepare_wake_word_runtime.py"
      - "tests/test_wake_word_runtime_artifacts.py"
      - "wake-word-artifacts.json"
      - "docs/licenses/SHERPA_ONNX_RUNTIME_NOTICE.md"
      - ".github/workflows/wake-word-runtime-identity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/freeze_wake_word_runtime_identity.py
      - run: python3 -m unittest tests/test_wake_word_runtime_artifacts.py
