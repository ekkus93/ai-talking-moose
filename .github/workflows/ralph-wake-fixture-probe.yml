name: Ralph Wake Fixture Probe

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-fixture-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect immutable model repository tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          rev='b73da3087e40072f6251351acd5f54a8c563bd11'
          url=f'https://huggingface.co/api/models/openEuler/sherpa-kws/tree/{rev}?recursive=true&expand=false'
          with urllib.request.urlopen(url, timeout=30) as r:
              rows=json.load(r)
          print('::error::WAKE_FIXTURE_TREE_BEGIN')
          for row in rows:
              p=row.get('path','')
              if any(k in p.lower() for k in ('wav','audio','test','example','sample')):
                  print(f'::error::WAKE_FIXTURE_PATH {p}')
          print('::error::WAKE_FIXTURE_TREE_END')
          PY
          exit 1
