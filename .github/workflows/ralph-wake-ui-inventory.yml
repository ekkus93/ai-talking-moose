name: Ralph Wake UI Inventory

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-ui-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report relevant frontend files
        shell: bash
        run: |
          set -euo pipefail
          echo '::error::WAKE_UI_INVENTORY_BEGIN'
          while IFS= read -r path; do
            echo "::error::WAKE_UI_FILE $path"
          done < <(grep -RIlE 'show_in_menu_bar|idle_banter_enabled|AppSettings|AudioDiagnostics' src | sort -u | head -80)
          echo '::error::WAKE_UI_INVENTORY_END'
          exit 1
