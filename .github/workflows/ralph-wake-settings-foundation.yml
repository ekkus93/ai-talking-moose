name: Ralph Wake Settings Foundation

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-settings-foundation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply wake settings foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          replace(
              "src-tauri/src/audio/wake_word/mod.rs",
              'pub const WAKE_RING_BUFFER_SECONDS: u32 = 2;\n',
              '''pub const WAKE_RING_BUFFER_SECONDS: u32 = 2;\n\npub fn normalize_wake_phrase(value: &str) -> Option<String> {\n    let normalized = value\n        .chars()\n        .map(|character| {\n            if character.is_alphanumeric() || character.is_whitespace() {\n                character\n            } else {\n                ' '\n            }\n        })\n        .collect::<String>()\n        .split_whitespace()\n        .collect::<Vec<_>>()\n        .join(" ")\n        .to_ascii_uppercase();\n    (normalized == CANONICAL_WAKE_KEYWORD).then(|| DEFAULT_WAKE_PHRASE.to_string())\n}\n\n#[cfg(test)]\nmod phrase_tests {\n    use super::*;\n\n    #[test]\n    fn v1_phrase_normalization_is_fixed_and_deterministic() {\n        for value in ["Hey, Moose", "hey moose", "HEY MOOSE", " Hey   Moose "] {\n            assert_eq!(normalize_wake_phrase(value).as_deref(), Some(DEFAULT_WAKE_PHRASE));\n        }\n        assert_eq!(normalize_wake_phrase("Hey Bruce"), None);\n        assert_eq!(normalize_wake_phrase("Moose"), None);\n    }\n}\n'''
          )

          replace(
              "src-tauri/src/app/state.rs",
              'use crate::audio::capture::AudioCapture;\n',
              'use crate::audio::capture::AudioCapture;\nuse crate::audio::wake_word::{normalize_wake_phrase, WakeWordRuntimeManager, DEFAULT_WAKE_PHRASE};\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '    pub pitch: f32,\n\n    // AI Configuration\n',
              '    pub pitch: f32,\n    pub wake_word_enabled: bool,\n    pub wake_phrase: String,\n\n    // AI Configuration\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '            pitch: -1.5,\n\n            // P12 real-CPU acceptance selected Local text as the new-profile default.\n',
              '            pitch: -1.5,\n            wake_word_enabled: false,\n            wake_phrase: DEFAULT_WAKE_PHRASE.to_string(),\n\n            // P12 real-CPU acceptance selected Local text as the new-profile default.\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '        let had_live_voice = value.get("live_voice").is_some();\n',
              '        let had_live_voice = value.get("live_voice").is_some();\n        let had_wake_word_enabled = value.get("wake_word_enabled").is_some();\n        let had_wake_phrase = value.get("wake_phrase").is_some();\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '        settings.live_voice = normalized_live_voice;\n\n        // Window-title observation is an unsupported V1 compatibility field, not an\n',
              '''        settings.live_voice = normalized_live_voice;\n        let normalized_wake_phrase = normalize_wake_phrase(&settings.wake_phrase).ok_or_else(|| {\n            PersistedSettingsError::Invalid("unsupported wake phrase".to_string())\n        })?;\n        let wake_phrase_migrated = normalized_wake_phrase != settings.wake_phrase;\n        settings.wake_phrase = normalized_wake_phrase;\n\n        // Window-title observation is an unsupported V1 compatibility field, not an\n'''
          )
          replace(
              "src-tauri/src/app/state.rs",
              '                || !had_live_voice\n                || had_legacy_provider\n',
              '                || !had_live_voice\n                || !had_wake_word_enabled\n                || !had_wake_phrase\n                || wake_phrase_migrated\n                || had_legacy_provider\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '    pub(crate) local_tts_runtime: Arc<LocalTtsRuntimeManager>,\n',
              '    pub(crate) local_tts_runtime: Arc<LocalTtsRuntimeManager>,\n    pub wake_word_runtime: Arc<WakeWordRuntimeManager>,\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '        let local_tts_runtime = Arc::new(LocalTtsRuntimeManager::new());\n\n        let builtin_tools = Arc::new(BuiltinTools {\n',
              '        let local_tts_runtime = Arc::new(LocalTtsRuntimeManager::new());\n        let wake_word_runtime = Arc::new(WakeWordRuntimeManager::new());\n\n        let builtin_tools = Arc::new(BuiltinTools {\n'
          )
          replace(
              "src-tauri/src/app/state.rs",
              '            local_tts_runtime,\n            tool_router,\n',
              '            local_tts_runtime,\n            wake_word_runtime,\n            tool_router,\n'
          )

          replace(
              "src-tauri/src/app/settings_policy.rs",
              'use crate::app::state::AppSettings;\n',
              'use crate::app::state::AppSettings;\nuse crate::audio::wake_word::{normalize_wake_phrase, DEFAULT_WAKE_PHRASE};\n'
          )
          replace(
              "src-tauri/src/app/settings_policy.rs",
              '    optional_device_id("output device ID", settings.output_device.as_deref())?;\n\n    finite_range("talkativeness", settings.talkativeness, 0.0, 1.0)?;\n',
              '''    optional_device_id("output device ID", settings.output_device.as_deref())?;\n    if normalize_wake_phrase(&settings.wake_phrase).as_deref() != Some(DEFAULT_WAKE_PHRASE)\n        || settings.wake_phrase != DEFAULT_WAKE_PHRASE\n    {\n        return Err("wake phrase must be the V1 default: Hey, Moose".to_string());\n    }\n\n    finite_range("talkativeness", settings.talkativeness, 0.0, 1.0)?;\n'''
          )
          replace(
              "src-tauri/src/app/settings_policy.rs",
              '            ("pitch", "standalone TTS request"),\n',
              '            ("pitch", "standalone TTS request"),\n            ("wake_word_enabled", "local wake-word runtime gate"),\n            ("wake_phrase", "fixed V1 local wake phrase"),\n'
          )
          replace(
              "src-tauri/src/app/settings_policy.rs",
              '        let mut next = previous.clone();\n        next.memory_enabled = !previous.memory_enabled;\n',
              '''        let mut next = previous.clone();\n        next.wake_word_enabled = !previous.wake_word_enabled;\n        assert!(!conversation_restart_required(&previous, &next));\n\n        let mut next = previous.clone();\n        next.memory_enabled = !previous.memory_enabled;\n'''
          )

          replace(
              "src/types/moose.ts",
              '  pitch: number;\n\n  text_provider: TextProvider;\n',
              '  pitch: number;\n  wake_word_enabled: boolean;\n  wake_phrase: string;\n\n  text_provider: TextProvider;\n'
          )

          runtime = Path("src-tauri/src/audio/wake_word/runtime.rs")
          text = runtime.read_text()
          old = '''                    if sender.try_send(samples).is_err() {\n                        self.inner.lock().dropped_engine_chunks =\n                            self.inner.lock().dropped_engine_chunks.saturating_add(1);\n                    }\n'''
          new = '''                    if sender.try_send(samples).is_err() {\n                        let mut inner = self.inner.lock();\n                        inner.dropped_engine_chunks = inner.dropped_engine_chunks.saturating_add(1);\n                    }\n'''
          if old not in text:
              raise SystemExit("runtime deadlock pattern not found")
          text = text.replace(old, new, 1)
          old = '''            if !inner.enabled\n                || !matches!(\n                    inner.state,\n                    WakeWordRuntimeState::Listening | WakeWordRuntimeState::Triggered\n                )\n            {\n'''
          new = '''            if !inner.enabled || inner.state != WakeWordRuntimeState::Triggered {\n'''
          if old not in text:
              raise SystemExit("handoff state pattern not found")
          text = text.replace(old, new, 1)
          old = '''        let (manager, _, _) = started_manager(false).await;\n        manager\n            .ingest_pcm_bytes(AudioResampler::i16_to_bytes(&[1, 2, 3, 4]))\n            .unwrap();\n        let (tx, mut rx) = mpsc::channel(8);\n'''
          new = '''        let (manager, _, _) = started_manager(false).await;\n        manager\n            .ingest_pcm_bytes(AudioResampler::i16_to_bytes(&[1, 2, 3, 4]))\n            .unwrap();\n        manager.inner.lock().state = WakeWordRuntimeState::Triggered;\n        let (tx, mut rx) = mpsc::channel(8);\n'''
          if old not in text:
              raise SystemExit("handoff test pattern not found")
          text = text.replace(old, new, 1)
          old = '''        manager.resume_listening().unwrap();\n        let (tx, mut rx) = mpsc::channel(8);\n        assert_eq!(manager.begin_command_handoff(tx, None).unwrap(), 0);\n'''
          new = '''        manager.resume_listening().unwrap();\n        manager.inner.lock().state = WakeWordRuntimeState::Triggered;\n        let (tx, mut rx) = mpsc::channel(8);\n        assert_eq!(manager.begin_command_handoff(tx, None).unwrap(), 0);\n'''
          if old not in text:
              raise SystemExit("talking test handoff pattern not found")
          text = text.replace(old, new, 1)
          runtime.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/ralph-wake-settings-foundation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/audio/wake_word src-tauri/src/app/state.rs src-tauri/src/app/settings_policy.rs src/types/moose.ts .github/workflows/ralph-wake-settings-foundation.yml
          git commit -m "feat: add wake settings and runtime ownership"
          git push origin HEAD:ralph/wake-word-v1-core
