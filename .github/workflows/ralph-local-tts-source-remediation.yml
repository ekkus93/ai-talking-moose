          +        assert!(validate_local_tts_voice(&previous.local_tts_voice).is_ok());
          +        assert!(validate_local_tts_voice(&next.local_tts_voice).is_ok());
          +        assert_ne!(previous.local_tts_voice, next.local_tts_voice);
                   assert!(!conversation_restart_required(&previous, &next));
           
                   let mut next = previous.clone();
          diff --git a/src-tauri/src/app/state.rs b/src-tauri/src/app/state.rs
          index e2781f61..559635b0 100644
          --- a/src-tauri/src/app/state.rs
          +++ b/src-tauri/src/app/state.rs
          @@ -955,6 +955,36 @@ mod tests {
                   ));
               }
           
          +    #[test]
          +    fn current_profile_preserves_persisted_bella_local_tts_voice() {
          +        let settings = AppSettings {
          +            local_tts_voice: "Bella".to_string(),
