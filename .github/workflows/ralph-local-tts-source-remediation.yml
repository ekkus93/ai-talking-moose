name: Ralph one-shot Local TTS source remediation

on:
  push:
    branches:
      - ralph/local-tts-post-review-hardening
    paths:
      - .github/workflows/ralph-local-tts-source-remediation.yml

permissions:
  contents: write

jobs:
  apply-source-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/local-tts-post-review-hardening
          fetch-depth: 0
      - name: Apply reviewed source remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = "src-tauri/src/ai/local_tts/runtime/engine.rs"
          replace_once(engine,
          '''    #[cfg(test)]
              inference_threads_override: Option<usize>,
          }
          ''',
          '''    #[cfg(test)]
              inference_threads_override: Option<usize>,
              #[cfg(test)]
              last_waveform_shape: Option<Vec<i64>>,
          }
          ''')
          replace_once(engine,
          '''            #[cfg(test)]
                      inference_threads_override: None,
                  }
          ''',
          '''            #[cfg(test)]
                      inference_threads_override: None,
                      #[cfg(test)]
                      last_waveform_shape: None,
                  }
          ''')
          replace_once(engine,
          '''            inference_threads_override: Some(inference_threads),
                  }
              }
          
              fn manifest(&self) -> Result<&'static LocalTtsModelManifest, LocalTtsRuntimeError> {
          ''',
          '''            inference_threads_override: Some(inference_threads),
                      last_waveform_shape: None,
                  }
              }
          
              #[cfg(test)]
              fn last_waveform_shape(&self) -> Option<&[i64]> {
                  self.last_waveform_shape.as_deref()
              }
          
              fn manifest(&self) -> Result<&'static LocalTtsModelManifest, LocalTtsRuntimeError> {
          ''')
          replace_once(engine,
          '''        let (_shape, samples) = waveform
                      .try_extract_tensor::<f32>()
                      .map_err(|_| LocalTtsRuntimeError::inference())?;
                  let samples = samples.to_vec();
                  if samples.is_empty() || samples.iter().any(|sample| !sample.is_finite()) {
          ''',
          '''        let (shape, samples) = waveform
                      .try_extract_tensor::<f32>()
                      .map_err(|_| LocalTtsRuntimeError::inference())?;
                  let shape_values: &[i64] = &**shape;
                  if !waveform_shape_is_valid(shape_values, samples.len()) {
                      return Err(LocalTtsRuntimeError::inference());
                  }
                  #[cfg(test)]
                  {
                      self.last_waveform_shape = Some(shape_values.to_vec());
                  }
                  let samples = samples.to_vec();
                  if samples.iter().any(|sample| !sample.is_finite()) {
          ''')
          replace_once(engine,
          '''fn model_output_contract_is_valid(
          ''',
          '''fn waveform_shape_is_valid(shape: &[i64], sample_count: usize) -> bool {
              if sample_count == 0 {
                  return false;
              }
          
              let samples_match = |dimension: i64| {
                  usize::try_from(dimension).ok() == Some(sample_count)
              };
          
              match shape {
                  [samples] => samples_match(*samples),
                  [batch, samples] => *batch == 1 && samples_match(*samples),
                  _ => false,
              }
          }
          
          fn model_output_contract_is_valid(
          ''')
          replace_once(engine,
          '''    #[test]
              fn unknown_runtime_identity_fails_closed_before_artifact_use() {
          ''',
          '''    #[test]
              fn waveform_shape_requires_mono_vector_or_single_batch_vector() {
                  assert!(waveform_shape_is_valid(&[24_000], 24_000));
                  assert!(waveform_shape_is_valid(&[1, 24_000], 24_000));
                  assert!(!waveform_shape_is_valid(&[], 0));
                  assert!(!waveform_shape_is_valid(&[0], 0));
                  assert!(!waveform_shape_is_valid(&[2, 12_000], 24_000));
                  assert!(!waveform_shape_is_valid(&[1, 1, 24_000], 24_000));
                  assert!(!waveform_shape_is_valid(&[1, 23_999], 24_000));
              }
          
              #[test]
              fn unknown_runtime_identity_fails_closed_before_artifact_use() {
          ''')
          replace_once(engine,
          '''        assert_eq!(output.sample_rate_hz, 24_000);
                  assert!(!output.samples.is_empty());
                  assert!(output.samples.iter().all(|sample| sample.is_finite()));
          
                  let faster = engine
          ''',
          '''        assert_eq!(output.sample_rate_hz, 24_000);
                  assert!(!output.samples.is_empty());
                  assert!(output.samples.iter().all(|sample| sample.is_finite()));
                  let waveform_shape = engine
                      .last_waveform_shape()
                      .expect("real KittenTTS acceptance must record the runtime waveform shape");
                  assert!(waveform_shape_is_valid(waveform_shape, output.samples.len()));
                  println!("KITTENTTS_WAVEFORM_SHAPE={waveform_shape:?}");
          
                  let faster = engine
          ''')

          replace_once("src-tauri/src/app/settings_policy.rs",
          '''        next.local_tts_voice = "Luna".to_string();
                  assert!(!conversation_restart_required(&previous, &next));
          ''',
          '''        next.local_tts_voice = "Leo".to_string();
                  assert!(validate_local_tts_voice(&previous.local_tts_voice).is_ok());
                  assert!(validate_local_tts_voice(&next.local_tts_voice).is_ok());
                  assert_ne!(previous.local_tts_voice, next.local_tts_voice);
                  assert!(!conversation_restart_required(&previous, &next));
          ''')

          replace_once("src-tauri/src/app/state.rs",
          '''    #[test]
              fn split_tts_voice_settings_round_trip_independently() {
          ''',
          '''    #[test]
              fn current_profile_preserves_persisted_bella_local_tts_voice() {
                  let settings = AppSettings {
                      local_tts_voice: "Bella".to_string(),
                      ..Default::default()
                  };
          
                  let (loaded, migrated) =
                      AppSettings::from_persisted_json(&serde_json::to_string(&settings).unwrap()).unwrap();
          
                  assert!(!migrated);
                  assert_eq!(loaded.local_tts_voice, "Bella");
              }
          
              #[test]
              fn missing_local_tts_voice_defaults_to_current_luna_without_forced_voice_migration() {
                  assert_eq!(DEFAULT_LOCAL_TTS_VOICE, "Luna");
                  let mut value = serde_json::to_value(AppSettings::default()).unwrap();
                  value
                      .as_object_mut()
                      .unwrap()
                      .remove("local_tts_voice");
          
                  let (loaded, migrated) =
                      AppSettings::from_persisted_json(&serde_json::to_string(&value).unwrap()).unwrap();
          
                  assert!(migrated);
                  assert_eq!(loaded.local_tts_voice, DEFAULT_LOCAL_TTS_VOICE);
              }
          
              #[test]
              fn split_tts_voice_settings_round_trip_independently() {
          ''')

          replace_once("src-tauri/src/asr/pipeline_benchmarks.rs",
          '''/// Automated intelligibility smoke only. This deliberately does not replace
          /// the deferred human KCR-330 audition for naturalness, character fit, or the
          /// final default-voice decision.
          ''',
          '''/// Automated intelligibility smoke only. This test does not measure subjective
          /// naturalness, character fit, timbre, or fatigue. A later owner-approved ASR
          /// proxy used this objective evidence as part of the V1 default-voice decision;
          /// that policy decision does not turn this smoke test into human-listening evidence.
          ''')

          Path(".github/workflows/ralph-local-tts-source-remediation.yml").unlink()
          PY
          git diff --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Local TTS review findings'
          git push origin HEAD:ralph/local-tts-post-review-hardening
