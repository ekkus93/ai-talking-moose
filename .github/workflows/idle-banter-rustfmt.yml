name: Idle Banter rustfmt

on:
  push:
    branches:
      - ralph/idle-banter-implementation
    paths:
      - .github/idle-banter-rustfmt/READY

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ralph/idle-banter-implementation
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -rf .github/idle-banter-rustfmt
          rm -f .github/workflows/idle-banter-rustfmt.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Idle Banter Rust"
          git push origin HEAD:ralph/idle-banter-implementation
