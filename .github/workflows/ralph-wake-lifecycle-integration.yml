name: Ralph Wake Lifecycle Integration

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-lifecycle-integration.yml
      - .github/ralph/wake_lifecycle_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply wake lifecycle integration
        run: python3 .github/ralph/wake_lifecycle_patch.py
      - name: Format and publish patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/ralph-wake-lifecycle-integration.yml
          rm .github/ralph/wake_lifecycle_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src .github/workflows/ralph-wake-lifecycle-integration.yml .github/ralph/wake_lifecycle_patch.py
          git commit -m "feat: integrate wake capture and command handoff"
          git push origin HEAD:ralph/wake-word-v1-core
