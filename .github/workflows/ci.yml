name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Ordinary CI is explicitly offline with respect to live Gemini calls. The sole live
  # integration test is ignored and also requires this guard to be set to 1 manually.
  TALKING_MOOSE_ALLOW_LIVE_API: "0"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Reject tracked generated frontend trees
        run: npm run check:generated-trees

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Tauri command registration contract
        run: npm run check:tauri-command-contract

      - name: Verify frontend IPC shape contract
        run: npm run check:frontend-contract-shapes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Validate Moonshine native runtime manifest
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Run backend failure matrix
        run: bash scripts/run_backend_failure_matrix.sh

      - name: Run backend stress matrix
        run: bash scripts/run_backend_stress_matrix.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Production packages ship with the application and remain a blocking gate.
      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      # The complete Node dependency tree is a blocking release-quality gate.
      - name: Audit development Node dependencies
        run: npm audit --include=dev --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  release-static:
    name: Release metadata static gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated backend contract is current
        run: npm run check:generated-backend-contract

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate release metadata and icon set
        run: python3 scripts/validate_release_metadata.py

      - name: Validate release helper syntax
        run: |
          python3 -m py_compile \
            scripts/generate_app_icons.py \
            scripts/validate_release_metadata.py \
            scripts/collect_release_licenses.py
          bash -n scripts/prepare_moonshine_macos.sh
          bash -n scripts/verify_macos_bundle.sh
          bash -n scripts/verify_app_build_provenance.sh
          bash -n scripts/verify_macos_release.sh
          bash -n scripts/run_p2_p3_macos_physical_acceptance.sh
          bash -n scripts/run_p13_macos_release_acceptance.sh
          bash -n scripts/run_backend_failure_matrix.sh
          bash -n scripts/run_backend_stress_matrix.sh

      - name: Validate dependency license collection
        run: python3 scripts/collect_release_licenses.py

  macos-bundle:
    name: macOS Tauri bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            deployment_target: "13.4"
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: "13.4"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate release metadata and icon set
        run: python3 scripts/validate_release_metadata.py

      - name: Validate Moonshine runtime provenance
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Build pinned Moonshine native runtime
        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"

      - name: Build unsigned macOS application smoke bundle
        run: npm run tauri build -- --bundles app

      - name: Verify self-contained native runtime bundle
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          bash scripts/verify_macos_bundle.sh "$app_path" "${{ matrix.arch }}"

      - name: Verify packaged build provenance
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          bash scripts/verify_app_build_provenance.sh "$app_path" "$GITHUB_SHA"
