name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Ordinary CI is explicitly offline with respect to live Gemini calls. The sole live
  # integration test is ignored and also requires this guard to be set to 1 manually.
  TALKING_MOOSE_ALLOW_LIVE_API: "0"

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      native_sensitive: ${{ steps.scope.outputs.native_sensitive }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          force_full=false
          base_sha=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_NAME" == refs/tags/* ]]; then
            force_full=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "$zero_sha" ]]; then
            force_full=true
          fi

          if [[ "$force_full" == "true" ]]; then
            docs_only=false
            native_sensitive=true
            echo "Full CI forced for $EVENT_NAME on $REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          else
            mapfile -t changed_files < <(git diff --name-only "$base_sha" "$HEAD_SHA")

            if (( ${#changed_files[@]} == 0 )); then
              docs_only=false
              native_sensitive=true
            else
              docs_only=true
              native_sensitive=false

              for path in "${changed_files[@]}"; do
                if [[ "$path" == docs/* || ( "$path" != */* && "$path" == *.md ) ]]; then
                  :
                else
                  docs_only=false
                fi

                case "$path" in
                  .github/workflows/*|.github/actions/*|src-tauri/*|scripts/*|package.json|package-lock.json|npm-shrinkwrap.json)
                    native_sensitive=true
                    ;;
                esac
              done
            fi

            {
              echo "### CI scope"
              echo
              echo "Base: \`$base_sha\`"
              echo "Head: \`$HEAD_SHA\`"
              echo "Docs only: \`$docs_only\`"
              echo "Native/build sensitive: \`$native_sensitive\`"
              echo
              echo "Changed files:"
              for path in "${changed_files[@]}"; do
                echo "- \`$path\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "native_sensitive=$native_sensitive" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  docs-only:
    name: Docs-only fast path
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate documentation diff
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA"

  frontend:
    name: Frontend quality
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Reject tracked generated frontend trees
        run: npm run check:generated-trees

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Tauri command registration contract
        run: npm run check:tauri-command-contract

      - name: Verify frontend IPC shape contract
        run: npm run check:frontend-contract-shapes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Smoke frontend-only Vite preview
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/vite-preview.log"
          index_file="$RUNNER_TEMP/vite-preview-index.html"
          npm run dev -- --host 127.0.0.1 --strictPort >"$log_file" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:1420/ -o "$index_file"; then
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 0.25
          done
          test -s "$index_file"
          grep -q 'id="root"' "$index_file"
          curl --fail --silent --show-error http://127.0.0.1:1420/src/main.tsx >/dev/null

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust quality
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Validate Moonshine native runtime manifest
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Run backend failure matrix
        run: bash scripts/run_backend_failure_matrix.sh

      - name: Run backend stress matrix
        run: bash scripts/run_backend_stress_matrix.sh

  local-llm-compile-proof:
    name: Local LLM compile proof (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.native_sensitive == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            os: linux
          - label: macos-arm64
            runner: macos-15
            os: macos
          - label: macos-x86_64
            runner: macos-15-intel
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux llama.cpp build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libclang-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.label }}-llm-proof-${{ hashFiles('src-tauri/llama-compile-proof/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-llm-proof-

      - name: Compile and run llama.cpp CPU-policy proof
        run: cargo test --manifest-path src-tauri/llama-compile-proof/Cargo.toml --locked

  dependency-audit:
    name: Dependency audit
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Production packages ship with the application and remain a blocking gate.
      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      # The complete Node dependency tree is a blocking release-quality gate.
      - name: Audit development Node dependencies
        run: npm audit --include=dev --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  release-static:
    name: Release metadata static gate
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated backend contract is current
        run: npm run check:generated-backend-contract

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate release metadata and icon set
        run: python3 scripts/validate_release_metadata.py

      - name: Validate release helper syntax
        run: |
          python3 -m py_compile \
            scripts/generate_app_icons.py \
            scripts/validate_release_metadata.py \
            scripts/collect_release_licenses.py \
            scripts/check_local_llm_packaging_policy.py \
            scripts/measure_local_llm_bundle_impact.py
          bash -n scripts/prepare_moonshine_macos.sh
          bash -n scripts/verify_macos_bundle.sh
          bash -n scripts/verify_app_build_provenance.sh
          bash -n scripts/verify_macos_release.sh
          bash -n scripts/run_p2_p3_macos_physical_acceptance.sh
          bash -n scripts/run_p13_macos_release_acceptance.sh
          bash -n scripts/run_backend_failure_matrix.sh
          bash -n scripts/run_backend_stress_matrix.sh

      - name: Validate Local LLM packaging policy
        run: python3 scripts/check_local_llm_packaging_policy.py

      - name: Validate dependency license collection
        run: python3 scripts/collect_release_licenses.py

  macos-bundle:
    name: macOS Tauri bundle (${{ matrix.arch }})
    needs: classify
    if: needs.classify.outputs.native_sensitive == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            deployment_target: "13.4"
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: "13.4"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate release metadata and icon set
        run: python3 scripts/validate_release_metadata.py

      - name: Validate Moonshine runtime provenance
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Build pinned Moonshine native runtime
        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"

      - name: Collect dependency license texts
        run: python3 scripts/collect_release_licenses.py

      - name: Build unsigned macOS application smoke bundle
        run: npm run tauri build -- --bundles app

      - name: Verify self-contained native runtime bundle
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          bash scripts/verify_macos_bundle.sh "$app_path" "${{ matrix.arch }}"

      - name: Verify packaged build provenance
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          bash scripts/verify_app_build_provenance.sh "$app_path" "$GITHUB_SHA"

  canonical-check-all:
    name: Canonical npm run check:all
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-canonical-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-canonical-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Run canonical repository gate
        run: npm run check:all
