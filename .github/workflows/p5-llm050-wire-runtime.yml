name: P5 LLM-050 runtime ownership wiring

on:
  push:
    branches:
      - ralph/local-llm-p5-runtime-20260831

permissions:
  contents: write

jobs:
  wire-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out P5 branch
        uses: actions/checkout@v7
        with:
          ref: ralph/local-llm-p5-runtime-20260831

      - name: Wire runtime owner into AppState and shutdown
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src-tauri/src/app/state.rs",
              "use crate::ai::local::{UnavailableLocalTextModel, DEFAULT_LOCAL_TEXT_MODEL_ID};",
              "use crate::ai::local::{\n    LocalRuntimeManager, UnavailableLocalTextModel, DEFAULT_LOCAL_TEXT_MODEL_ID,\n};",
          )
          replace_once(
              "src-tauri/src/app/state.rs",
              "    pub moonshine_installer: Arc<MoonshineModelInstaller>,\n    pub tool_router: Arc<ToolRouter>,",
              "    pub moonshine_installer: Arc<MoonshineModelInstaller>,\n    pub(crate) local_llm_runtime: Arc<LocalRuntimeManager>,\n    pub tool_router: Arc<ToolRouter>,",
          )
          replace_once(
              "src-tauri/src/app/state.rs",
              "        let moonshine_installer = Arc::new(\n            MoonshineModelInstaller::new(moonshine_model_root(db_path))\n                .map_err(|error| error.to_string())?,\n        );\n\n        let builtin_tools",
              "        let moonshine_installer = Arc::new(\n            MoonshineModelInstaller::new(moonshine_model_root(db_path))\n                .map_err(|error| error.to_string())?,\n        );\n        let local_llm_runtime = Arc::new(LocalRuntimeManager::new());\n\n        let builtin_tools",
          )
          replace_once(
              "src-tauri/src/app/state.rs",
              "            conversation_mgr,\n            moonshine_installer,\n            tool_router,",
              "            conversation_mgr,\n            moonshine_installer,\n            local_llm_runtime,\n            tool_router,",
          )
          replace_once(
              "src-tauri/src/lib.rs",
              "            api.prevent_exit();\n            let handle = app_handle.clone();",
              "            api.prevent_exit();\n            if let Some(state) = app_handle.try_state::<AppState>() {\n                state.local_llm_runtime.begin_shutdown();\n            }\n            let handle = app_handle.clone();",
          )

      - name: Remove this one-shot workflow
        run: git rm .github/workflows/p5-llm050-wire-runtime.yml

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/app/state.rs src-tauri/src/lib.rs
          git diff --cached --check
          git diff --cached --quiet && { echo "No wiring changes produced" >&2; exit 1; }
          git commit -m "feat: own local LLM runtime in application state"
          git push origin HEAD:ralph/local-llm-p5-runtime-20260831
