name: Ralph Wake Word sherpa Rust API probe
on:
  push:
    branches:
      - ralph/wake-word-v1-core
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sherpa-onnx 1.13.8 Rust crate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sherpa-api-probe"
          rm -rf "$work"
          cargo new --lib "$work" >/dev/null
          cd "$work"
          cargo add 'sherpa-onnx@=1.13.8' >/dev/null
          cargo fetch >/dev/null
          crate_dir="$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name 'sherpa-onnx-1.13.8' | head -1)"
          test -n "$crate_dir"
          echo '=== KWS.RS ==='
          sed -n '1,280p' "$crate_dir/src/kws.rs"
          echo '=== ONLINE MODEL CONFIG ==='
          sed -n '1,230p' "$crate_dir/src/online_asr.rs"
          echo '=== ONLINE STREAM METHODS ==='
          sed -n '440,500p' "$crate_dir/src/online_asr.rs"
