name: Whisper macOS Native Compile

on:
  push:
    branches: [master]
    paths:
      - src-tauri/build.rs
      - src-tauri/src/asr/whisper/**
      - src-tauri/src/bin/whisper_acceptance.rs
      # Shared paths must requalify both macOS architectures whenever the
      # production Whisper pipeline, transcript state, or ASR contracts move.
      - src-tauri/src/asr/pipeline.rs
      - src-tauri/src/asr/pipeline_tests.rs
      - src-tauri/src/asr/pipeline_tests/**
      - src-tauri/src/asr/transcript_state.rs
      - src-tauri/src/asr/runtime_metrics.rs
      - src-tauri/src/asr/types.rs
      - src-tauri/src/asr/lifecycle.rs
      # Requalify persisted Whisper/Gemini defaults and migration on both Macs.
      - src-tauri/src/app/state.rs
      - src-tauri/src/app/state/tests/settings_migration.rs
      - src-tauri/src/app/state/tests/settings_migration_invalid_asr.rs
      - src-tauri/src/app/state/tests/mod.rs
      # Keep non-Live provider and macOS System Voice isolation under native CI.
      - src-tauri/src/app/state/tests/talk_routing.rs
      - src-tauri/src/app/state/tests/talk_routing_macos_system.rs
      - src-tauri/src/app/state/tests/talk_negative_paths.rs
      - scripts/whisper_ffi_abi_probe.c
      - .github/workflows/whisper-macos-native-compile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-compile:
    name: Pinned Whisper static link (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      TALKING_MOOSE_REQUIRE_WHISPER_NATIVE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out exact source with pinned Whisper submodule
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Assert exact source and target architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test -f third_party/whisper.cpp/CMakeLists.txt
          python3 scripts/check_whisper_provenance.py
          cmake --version
      - name: Compile pinned Whisper C ABI layout checks
        shell: bash
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            -I third_party/whisper.cpp/include \
            -I third_party/whisper.cpp/ggml/include \
            -c scripts/whisper_ffi_abi_probe.c \
            -o "$RUNNER_TEMP/whisper_ffi_abi_probe.o"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-whisper-native-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Generate application icons
        run: python3 scripts/generate_app_icons.py
      - name: Build native-linked Whisper acceptance executable without model downloads
        # This is a standalone Whisper CLI probe, not a packaged app. The
        # production bundle still retains Moonshine until WSP-200 qualifies
        # both Mac architectures; do not require its dylibs for this probe.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --features whisper-acceptance --bin whisper_acceptance
      - name: Invoke linked Whisper runtime without model downloads
        run: src-tauri/target/debug/whisper_acceptance probe-native
      - name: Record static binary and archive evidence
        shell: bash
        run: |
          set -euo pipefail
          binary=src-tauri/target/debug/whisper_acceptance
          test -f "$binary"
          file "$binary"
          lipo -archs "$binary" | grep -Fx "${{ matrix.arch }}"
          build_dir="build/whisper-$(rustc -vV | sed -n 's/^host: //p')"
          for archive in \
            "$build_dir/src/libwhisper.a" \
            "$build_dir/ggml/src/libggml.a" \
            "$build_dir/ggml/src/libggml-base.a" \
            "$build_dir/ggml/src/libggml-cpu.a"; do
            test -s "$archive" || { echo "Missing static Whisper archive: $archive" >&2; exit 1; }
            file "$archive"
          done
          # A native-linked acceptance CLI must not depend on a Homebrew or
          # packaged libwhisper/libggml dylib. These four libraries are static.
          otool -L "$binary" > "$RUNNER_TEMP/whisper-dynamic-libraries.txt"
          cat "$RUNNER_TEMP/whisper-dynamic-libraries.txt"
          if grep -Ei 'lib(whisper|ggml[^/]*)\.dylib|/opt/homebrew/.*(whisper|ggml)' \
            "$RUNNER_TEMP/whisper-dynamic-libraries.txt"; then
            echo "Unexpected dynamic Whisper/ggml library dependency" >&2
            exit 1
          fi
          test ! -e src-tauri/native/macos/ggml-small.bin
          # This is compile/link evidence only. Real-model offline inference
          # and physical mic qualification belong to WSP-200/WSP-700.
      - name: Run deterministic local Whisper lifecycle and installer regressions
        # Both architectures exercise real native linking alongside mock-based
        # pipeline/installer fault injection, without downloading model weights.
        # This is not a substitute for real-model or physical microphone tests.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            asr::pipeline::tests -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            asr::whisper::installer::tests -- --test-threads=1
      - name: Qualify macOS Whisper settings and non-Live provider isolation
        # These are deterministic settings/routing checks, not audible TTS,
        # real microphone, downloaded model, or packaged-app acceptance.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::settings_migration -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::settings_migration_invalid_asr -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing_macos_system -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::migrated_moonshine_profiles_keep_selected_text_and_tts_non_live -- --test-threads=1
          # Fresh Whisper profiles and explicit Gemini Live remain separate
          # for the full standalone text/TTS matrix on both Mac architectures.
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::all_text_providers_with_local_asr_connect_without_gemini_live -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::explicit_live_asr_is_separate_from_every_standalone_provider_pair -- --test-threads=1
          # Exercise credential and local-endpoint fail-closed paths on
          # actual macOS runners, not only the Linux unit-test matrix.
          # No live provider credentials, microphone or TTS output are used.
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::missing_openai_key_in_non_live_talk_does_not_fall_back -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::missing_google_text_key_in_whisper_non_live_talk_never_starts_tts -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::invalid_loopback_server_cannot_fall_back_to_cloud_or_any_standalone_voice -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_routing::whisper_with_macos_system_voice_keeps_every_text_provider_non_live -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            app::state::tests::talk_negative_paths::whisper_provider_snapshot_stays_non_live_after_switch_to_gemini_audio -- --test-threads=1
      - name: Verify required Whisper native runtime fails closed if archives are absent
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
          TALKING_MOOSE_REQUIRE_WHISPER_NATIVE: "1"
          TALKING_MOOSE_WHISPER_LIB_DIR: ${{ runner.temp }}/whisper-intentionally-missing-libraries
        run: |
          set -euo pipefail
          test ! -e "$TALKING_MOOSE_WHISPER_LIB_DIR"
          # Build script is rerun because it explicitly tracks the override env
          # and must reject an empty native directory even on a warm build.
          log="$RUNNER_TEMP/whisper-negative-link.log"
          if cargo build --locked --manifest-path src-tauri/Cargo.toml \
              --features whisper-acceptance --bin whisper_acceptance > "$log" 2>&1; then
            cat "$log" >&2
            echo "Required Whisper build unexpectedly succeeded without native archives" >&2
            exit 1
          fi
          if ! grep -Fq 'Required Whisper native build failed: explicit Whisper static archives are missing' "$log"; then
            cat "$log" >&2
            echo "Build failed for an unrelated reason, not the required Whisper policy" >&2
            exit 1
          fi
          echo "Required missing-Whisper native build failed closed on ${{ matrix.arch }}"
      - name: Build release-profile native Whisper and invoke the real linked runtime
        # Unlike debug ABI probes, this exercises the production Cargo profile.
        # Keep the model absent and do not create a signed/release app artifact.
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          set -euo pipefail
          test -z "${TALKING_MOOSE_WHISPER_LIB_DIR:-}"
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml \
            --features whisper-acceptance --bin whisper_acceptance
          binary=src-tauri/target/release/whisper_acceptance
          test -f "$binary"
          "$binary" probe-native
          lipo -archs "$binary" | grep -Fx "${{ matrix.arch }}"
          otool -L "$binary" > "$RUNNER_TEMP/whisper-release-dependencies.txt"
          if grep -Ei 'lib(whisper|ggml[^/]*)\.dylib|/opt/homebrew/.*(whisper|ggml)' \
              "$RUNNER_TEMP/whisper-release-dependencies.txt"; then
            echo "Release-profile Whisper unexpectedly depends on a dynamic developer library" >&2
            exit 1
          fi
          test ! -e src-tauri/native/macos/ggml-small.bin
      - name: Reject developer Whisper static archives in production release profile
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
          TALKING_MOOSE_WHISPER_LIB_DIR: ${{ runner.temp }}/whisper-release-override-forbidden
        run: |
          set -euo pipefail
          test ! -e "$TALKING_MOOSE_WHISPER_LIB_DIR"
          log="$RUNNER_TEMP/whisper-release-override-denied.log"
          if cargo build --locked --release --manifest-path src-tauri/Cargo.toml \
              --features whisper-acceptance --bin whisper_acceptance > "$log" 2>&1; then
            echo "Release build accepted developer-supplied native library path" >&2
            exit 1
          fi
          if ! grep -Fq 'is only allowed in debug/test builds; release builds must compile pinned whisper.cpp source' "$log"; then
            tail -n 70 "$log" >&2
            echo "Release build failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Reject missing pinned Whisper source in production release profile
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          set -euo pipefail
          test -z "${TALKING_MOOSE_WHISPER_LIB_DIR:-}"
          source_file=third_party/whisper.cpp/CMakeLists.txt
          missing_file="$RUNNER_TEMP/whisper-CMakeLists.intentionally-absent"
          test -f "$source_file"
          test ! -e "$missing_file"
          mv "$source_file" "$missing_file"
          trap 'mv "$missing_file" "$source_file"' EXIT
          # Force the Cargo build script to rerun even on a warm release cache.
          touch src-tauri/build.rs
          log="$RUNNER_TEMP/whisper-release-missing-source.log"
          if cargo build --locked --release --manifest-path src-tauri/Cargo.toml \
              --features whisper-acceptance --bin whisper_acceptance > "$log" 2>&1; then
            echo "Release build unexpectedly accepted missing pinned Whisper source" >&2
            exit 1
          fi
          if ! grep -Fq 'Required Whisper native build failed: pinned whisper.cpp submodule is not checked out' "$log"; then
            tail -n 70 "$log" >&2
            echo "Release build failed for an unexpected reason" >&2
            exit 1
          fi
