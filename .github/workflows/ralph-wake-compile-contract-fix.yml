name: Ralph Wake Compile Contract Fix

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-compile-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        run: |
          bash scripts/prepare_ubuntu_apt.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libasound2-dev \
            libayatana-appindicator3-dev libclang-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Fix compile errors and regenerate contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/audio/wake_word/engine.rs')
          text = p.read_text()
          text = text.replace('use serde::Deserialize;', 'use serde::{Deserialize, Serialize};')
          text = text.replace(
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, Error)]\n#[serde(rename_all = "snake_case")]\npub enum WakeWordErrorKind',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, Error, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum WakeWordErrorKind',
          )
          p.write_text(text)

          p = Path('src-tauri/src/asr/pipeline.rs')
          text = p.read_text().replace(
              '    pub(super) fn enqueue_pre_roll(&self, bytes: Vec<u8>) -> Result<(), AsrError> {',
              '    pub(crate) fn enqueue_pre_roll(&self, bytes: Vec<u8>) -> Result<(), AsrError> {',
          )
          p.write_text(text)

          p = Path('src-tauri/src/audio/wake_word/runtime.rs')
          p.write_text(p.read_text().replace('vec![1, 0; 1600]', 'vec![1, 0].repeat(1600)'))

          p = Path('src-tauri/src/commands/wake_word.rs')
          text = p.read_text()
          text = text.replace(
              '''async fn handle_wake_trigger<R: Runtime>(state: AppState, app: tauri::AppHandle<R>) {\n    if state.conversation_mgr.is_active() || !state.settings.read().wake_word_enabled {\n        return;\n    }\n''',
              '''async fn handle_wake_trigger<R: Runtime>(state: AppState, app: tauri::AppHandle<R>) {\n    let wake_enabled = { state.settings.read().wake_word_enabled };\n    if state.conversation_mgr.is_active() || !wake_enabled {\n        return;\n    }\n''',
          )
          text = text.replace(
              '''    let settings = state.settings.read().clone();\n    if !settings.wake_word_enabled {\n''',
              '''    let settings = { state.settings.read().clone() };\n    if !settings.wake_word_enabled {\n''',
          )
          text = text.replace(
              '''    if state.conversation_mgr.is_active() || *state.character_state.read() != CharacterState::Idle {\n        return Ok(());\n    }\n    if state.wake_word_runtime.state() == WakeWordRuntimeState::Listening\n        && state.audio_capture.lock().is_active()\n    {\n        return Ok(());\n    }\n''',
              '''    let character_is_idle = { *state.character_state.read() == CharacterState::Idle };\n    if state.conversation_mgr.is_active() || !character_is_idle {\n        return Ok(());\n    }\n    let capture_active = { state.audio_capture.lock().is_active() };\n    if state.wake_word_runtime.state() == WakeWordRuntimeState::Listening && capture_active {\n        return Ok(());\n    }\n''',
          )
          old = '''    if let Err(error) =\n        state\n            .audio_capture\n            .lock()\n            .start(settings.input_device, 16_000, pcm_tx, Some(level_tx))\n    {\n        let _ = state.wake_word_runtime.stop().await;\n'''
          new = '''    let capture_start = {\n        let mut capture = state.audio_capture.lock();\n        capture.start(settings.input_device, 16_000, pcm_tx, Some(level_tx))\n    };\n    if let Err(error) = capture_start {\n        let _ = state.wake_word_runtime.stop().await;\n'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          bash scripts/generate_frontend_contract.sh
          rm .github/workflows/ralph-wake-compile-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src src/generated/backendContract.json src/generated/localTtsBackendContract.json .github/workflows/ralph-wake-compile-contract-fix.yml
          git diff --cached --check
          git commit -m "fix: compile wake lifecycle and refresh contract"
          git push origin HEAD:ralph/wake-word-v1-core
