name: Ralph Wake Compile Contract Fix

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-compile-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        run: |
          bash scripts/prepare_ubuntu_apt.sh
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libasound2-dev libayatana-appindicator3-dev libclang-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Apply source fixes and commit them first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{path}: missing replacement: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          replace("src-tauri/src/audio/wake_word/engine.rs", "use serde::Deserialize;", "use serde::{Deserialize, Serialize};")
          replace("src-tauri/src/audio/wake_word/engine.rs", "#[derive(Debug, Clone, Copy, PartialEq, Eq, Error)]\n#[serde(rename_all = \"snake_case\")]", "#[derive(Debug, Clone, Copy, PartialEq, Eq, Error, Serialize)]\n#[serde(rename_all = \"snake_case\")]")
          replace("src-tauri/src/audio/wake_word/runtime.rs", "vec![1, 0; 1600]", "vec![1_i16, 0].repeat(1600)")
          replace("src-tauri/src/asr/pipeline.rs", "    pub(super) fn enqueue_pre_roll", "    pub(crate) fn enqueue_pre_roll")

          p = Path("src-tauri/src/commands/wake_word.rs")
          text = p.read_text()
          text = text.replace("use std::sync::Arc;", "use std::future::Future;\nuse std::pin::Pin;\nuse std::sync::Arc;")
          text = text.replace("reconcile_wake_runtime(&state, app).await", "reconcile_wake_runtime(state, app).await")
          old = '''pub(crate) async fn reconcile_wake_runtime<R: Runtime>(\n    state: &AppState,\n    app: tauri::AppHandle<R>,\n) -> Result<(), String> {\n    let settings = state.settings.read().clone();\n'''
          new = '''pub(crate) fn reconcile_wake_runtime<R: Runtime>(\n    state: AppState,\n    app: tauri::AppHandle<R>,\n) -> Pin<Box<dyn Future<Output = Result<(), String>> + Send + 'static>> {\n    Box::pin(async move {\n    let settings = state.settings.read().clone();\n'''
          if old not in text:
              raise SystemExit("wake_word.rs: reconcile signature pattern missing")
          text = text.replace(old, new, 1)
          old_end = '''    Ok(())\n}\n\n#[tauri::command]\npub fn get_wake_word_diagnostics'''
          new_end = '''    Ok(())\n    })\n}\n\n#[tauri::command]\npub fn get_wake_word_diagnostics'''
          if old_end not in text:
              raise SystemExit("wake_word.rs: reconcile end pattern missing")
          text = text.replace(old_end, new_end, 1)
          # Scope all synchronous lock reads before awaits.
          text = text.replace(
              '''    if state.conversation_mgr.is_active() || !state.settings.read().wake_word_enabled {\n        return;\n    }\n''',
              '''    let wake_enabled = { state.settings.read().wake_word_enabled };\n    if state.conversation_mgr.is_active() || !wake_enabled {\n        return;\n    }\n''')
          text = text.replace(
              '''    if state.conversation_mgr.is_active() || *state.character_state.read() != CharacterState::Idle {\n        return Ok(());\n    }\n    if state.wake_word_runtime.state() == WakeWordRuntimeState::Listening\n        && state.audio_capture.lock().is_active()\n    {\n        return Ok(());\n    }\n''',
              '''    let idle = { *state.character_state.read() == CharacterState::Idle };\n    if state.conversation_mgr.is_active() || !idle {\n        return Ok(());\n    }\n    let capture_active = { state.audio_capture.lock().is_active() };\n    if state.wake_word_runtime.state() == WakeWordRuntimeState::Listening && capture_active {\n        return Ok(());\n    }\n''')
          text = text.replace(
              '''    if let Err(error) =\n        state\n            .audio_capture\n            .lock()\n            .start(settings.input_device, 16_000, pcm_tx, Some(level_tx))\n    {\n        let _ = state.wake_word_runtime.stop().await;\n        return Err(format!(\n            \"Failed to start wake-word microphone capture: {error}\"\n        ));\n    }\n''',
              '''    let capture_result = {\n        state\n            .audio_capture\n            .lock()\n            .start(settings.input_device, 16_000, pcm_tx, Some(level_tx))\n    };\n    if let Err(error) = capture_result {\n        let _ = state.wake_word_runtime.stop().await;\n        return Err(format!(\n            \"Failed to start wake-word microphone capture: {error}\"\n        ));\n    }\n''')
          p.write_text(text)

          for path in ["src-tauri/src/commands/settings.rs", "src-tauri/src/commands/conversation/core.rs", "src-tauri/src/lib.rs"]:
              p = Path(path)
              text = p.read_text()
              text = text.replace("reconcile_wake_runtime(state.inner(), app)", "reconcile_wake_runtime(state.inner().clone(), app)")
              text = text.replace("reconcile_wake_runtime(&wake_state, wake_app)", "reconcile_wake_runtime(wake_state, wake_app)")
              p.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/ralph-wake-compile-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src .github/workflows/ralph-wake-compile-contract-fix.yml
          git commit -m "fix: repair wake async and compile contracts"
          git push origin HEAD:ralph/wake-word-v1-core
      - name: Regenerate canonical backend contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:frontend-contract
          if ! git diff --quiet -- src/generated/backendContract.json src/generated/localTtsBackendContract.json; then
            git add src/generated/backendContract.json src/generated/localTtsBackendContract.json
            git commit -m "chore: regenerate wake settings contract"
            git push origin HEAD:ralph/wake-word-v1-core
          fi
