name: Wake Word required gates audit
# WWR-950 exact-head trigger: final closeout qualification.

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/wake-word-required-gates.json"
      - "docs/WAKE_WORD_V1_CI_GATES.md"
      - "scripts/check_wake_word_required_gates.mjs"
      - ".github/workflows/*.yml"
  push:
    branches: [master]
    paths:
      - "docs/wake-word-required-gates.json"
      - "docs/WAKE_WORD_V1_CI_GATES.md"
      - "scripts/check_wake_word_required_gates.mjs"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-gates:
    name: Wake Word required gates manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit Wake Word required gates manifest
        run: node scripts/check_wake_word_required_gates.mjs
