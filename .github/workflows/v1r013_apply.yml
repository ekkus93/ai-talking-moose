name: V1R-013 provider error patch

on:
  push:
    branches:
      - ralph/v1r-013-provider-errors-20260828

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate provider error patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/v1r013-provider-errors.patch
          git apply .github/v1r013-provider-errors.patch
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          ! grep -R "trace_google_transport_error" -n src-tauri/src
          ! grep -R "Result<TextResponse, String>" -n src-tauri/src
          ! grep -R "HTTP request to Gemini failed" -n src-tauri/src
          ! grep -R "Failed to parse Gemini response JSON" -n src-tauri/src
      - name: Commit clean candidate and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/v1r013-provider-errors.patch .github/workflows/v1r013_apply.yml
          git add src-tauri/src/ai src-tauri/src/commands/ambient.rs src-tauri/src/commands/conversation/core.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: sanitize provider error boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
