name: ASR015 Transport

on:
  push:
    branches:
      - master
    paths:
      - ".transport/asr015/trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply verified ASR-015 refactor
        shell: bash
        run: |
          set -euo pipefail

          cat .transport/asr015/part-* > /tmp/asr015.patch.gz.b64
          echo "253b2c6cc50d09557dbf8a330624f198dc2143c4025fd43053fd4fd97552249c  /tmp/asr015.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/asr015.patch.gz.b64 > /tmp/asr015.patch.gz
          echo "a5fd1d9cd4df3c23a64d61580d2336c6bc0e864f0b8343555eefa02a7bb225d9  /tmp/asr015.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/asr015.patch.gz > /tmp/asr015.patch
          echo "44588325d61f1f7213a70875255df798d66658a3d4cd2aeb2f5b3604cb48eccd  /tmp/asr015.patch" | sha256sum -c -

          git apply --check --index /tmp/asr015.patch
          git apply --index /tmp/asr015.patch
          git rm -r .transport/asr015 .github/workflows/asr015-transport.yml
          git diff --cached --check

          actual_tree="$(git write-tree)"
          test "$actual_tree" = "7a7c99f0de91b73766bea3e9cd51fb08b35b3b91"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "asr: add diagnostics and benchmark instrumentation"
          git push origin HEAD:master
