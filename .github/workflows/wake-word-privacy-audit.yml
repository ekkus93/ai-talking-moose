name: Wake Word privacy audit

on:
  push:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/wake_word_diagnostics.rs"
      - "src-tauri/src/app/wake_word_engine.rs"
      - "docs/WAKE_WORD_V1_CURRENT_BEHAVIOR.md"
      - "docs/wake-word-corpus.json"
      - "scripts/check_wake_word_privacy_audit.mjs"
      - ".github/workflows/wake-word-privacy-audit.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/wake_word_diagnostics.rs"
      - "src-tauri/src/app/wake_word_engine.rs"
      - "docs/WAKE_WORD_V1_CURRENT_BEHAVIOR.md"
      - "docs/wake-word-corpus.json"
      - "scripts/check_wake_word_privacy_audit.mjs"
      - ".github/workflows/wake-word-privacy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-word-privacy-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-audit:
    name: Wake Word privacy audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run Wake Word privacy audit
        run: node scripts/check_wake_word_privacy_audit.mjs
