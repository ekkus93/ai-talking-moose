name: One-shot Cargo Lock Repair

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/repair-cargo-lock.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-cargo-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate only the missing lock graph
        run: |
          set -euo pipefail
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

      - name: Verify lockfile delta is exactly the expected macOS dependency repair
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Cargo.lock.before" src-tauri/Cargo.lock src-tauri/Cargo.toml <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          before_path, after_path, manifest_path = map(Path, sys.argv[1:])
          before = tomllib.loads(before_path.read_text(encoding="utf-8"))
          after = tomllib.loads(after_path.read_text(encoding="utf-8"))
          manifest = tomllib.loads(manifest_path.read_text(encoding="utf-8"))

          def key(package):
              return (
                  package["name"],
                  package["version"],
                  package.get("source"),
              )

          before_packages = {key(package): package for package in before["package"]}
          after_packages = {key(package): package for package in after["package"]}

          root_key = next(key(package) for package in before["package"] if package["name"] == "talking-moose-ai")
          expected_added = {
              ("av-foundation", "0.8.1", "registry+https://github.com/rust-lang/crates.io-index"),
              ("block", "0.1.6", "registry+https://github.com/rust-lang/crates.io-index"),
              ("core-audio-types", "0.3.0", "registry+https://github.com/rust-lang/crates.io-index"),
              ("core-graphics2", "0.6.1", "registry+https://github.com/rust-lang/crates.io-index"),
              ("core-media", "0.8.1", "registry+https://github.com/rust-lang/crates.io-index"),
              ("core-video", "0.6.1", "registry+https://github.com/rust-lang/crates.io-index"),
              ("objc2-core-audio-types", "0.3.2", "registry+https://github.com/rust-lang/crates.io-index"),
          }
          expected_root_additions = {
              "av-foundation",
              "libc",
              "ring",
              "security-framework 3.7.0",
              "security-framework-sys",
              "tokio-util",
          }

          added = set(after_packages) - set(before_packages)
          removed = set(before_packages) - set(after_packages)
          if added != expected_added:
              raise SystemExit(f"unexpected added lock packages: {sorted(added)}")
          if removed:
              raise SystemExit(f"unexpected removed lock packages: {sorted(removed)}")

          # Cargo.lock records only the optional dependency edges that are active
          # in the resolved feature graph. Adding AVFoundation can therefore add
          # dependency edges to an already-locked package (for example
          # objc2-foundation) without changing that package's identity, version,
          # source, or checksum. Permit those additive edges, but reject every
          # other mutation to an existing package and reject dependency removals.
          feature_unified_packages = []
          for package_key, old_package in before_packages.items():
              if package_key == root_key:
                  continue
              new_package = after_packages[package_key]
              old_metadata = {
                  field: value
                  for field, value in old_package.items()
                  if field != "dependencies"
              }
              new_metadata = {
                  field: value
                  for field, value in new_package.items()
                  if field != "dependencies"
              }
              if new_metadata != old_metadata:
                  raise SystemExit(
                      f"existing package metadata changed unexpectedly: {package_key}"
                  )

              old_dependencies = set(old_package.get("dependencies", []))
              new_dependencies = set(new_package.get("dependencies", []))
              removed_dependencies = old_dependencies - new_dependencies
              if removed_dependencies:
                  raise SystemExit(
                      f"existing package lost dependencies unexpectedly: {package_key}: "
                      f"{sorted(removed_dependencies)}"
                  )
              added_dependencies = new_dependencies - old_dependencies
              if added_dependencies:
                  feature_unified_packages.append(
                      (package_key, sorted(added_dependencies))
                  )

          before_root = before_packages[root_key]
          after_root = after_packages[root_key]
          before_deps = set(before_root.get("dependencies", []))
          after_deps = set(after_root.get("dependencies", []))
          if after_deps - before_deps != expected_root_additions:
              raise SystemExit(
                  "unexpected root dependency additions: "
                  + repr(sorted(after_deps - before_deps))
              )
          if before_deps - after_deps:
              raise SystemExit(
                  "unexpected root dependency removals: "
                  + repr(sorted(before_deps - after_deps))
              )

          direct = set(manifest.get("dependencies", {}))
          direct |= set(manifest.get("dev-dependencies", {}))
          direct |= set(manifest.get("build-dependencies", {}))
          for target in manifest.get("target", {}).values():
              direct |= set(target.get("dependencies", {}))
          locked_direct = {
              re.match(r"^([^ ]+)", dependency).group(1)
              for dependency in after_root.get("dependencies", [])
          }
          if direct != locked_direct:
              raise SystemExit(
                  f"manifest/root lock dependency mismatch: manifest={sorted(direct)} lock={sorted(locked_direct)}"
              )

          if feature_unified_packages:
              print("Cargo feature unification added dependency edges to existing packages:")
              for package_key, dependencies in feature_unified_packages:
                  print(f"  {package_key}: {dependencies}")
          print("Cargo.lock delta is the expected macOS dependency repair.")
          PY

          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          git diff --check -- src-tauri/Cargo.lock
          test -n "$(git diff -- src-tauri/Cargo.lock)"
          dirty="$(git status --porcelain --untracked-files=no)"
          test "$dirty" = " M src-tauri/Cargo.lock"

      - name: Commit canonical Cargo.lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "fix: synchronize Cargo lock for macOS dependencies"
          git push origin HEAD:master

      - name: Dispatch ASR-015 acceptance against repaired master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run asr015-native-acceptance.yml --ref master
