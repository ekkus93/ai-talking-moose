name: WWR lockfile probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  emit-lockfile-diff:
    if: github.head_ref == 'ralph/wwr-200-native-kws-link'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only the stale lockfile and emit its diff
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          echo 'WWR_LOCKFILE_DIFF_BEGIN'
          git diff -- src-tauri/Cargo.lock
          echo 'WWR_LOCKFILE_DIFF_END'
