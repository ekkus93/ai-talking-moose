name: Cargo lockfile consistency

on:
  pull_request:
    branches: [master]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock

permissions:
  contents: read

jobs:
  locked-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require Cargo.toml and Cargo.lock consistency
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
