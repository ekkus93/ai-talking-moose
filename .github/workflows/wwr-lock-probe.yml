name: Cargo lockfile consistency

on:
  pull_request:
    branches: [master]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/wwr-lock-probe.yml

permissions:
  contents: read

jobs:
  locked-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require Cargo.toml and Cargo.lock consistency
        shell: bash
        run: |
          if cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null; then
            exit 0
          fi
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          echo 'WWR_LOCK_GZIP_BASE64_BEGIN'
          gzip -c src-tauri/Cargo.lock | base64 -w0
          echo
          echo 'WWR_LOCK_GZIP_BASE64_END'
          exit 1
