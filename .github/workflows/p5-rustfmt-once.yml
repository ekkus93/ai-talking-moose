name: P5 one-shot Rust formatting

on:
  push:
    branches:
      - ralph/local-llm-p5-runtime-20260831

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/local-llm-p5-runtime-20260831
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p5-rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/ai/local src-tauri/src/app/state.rs src-tauri/src/lib.rs
          git diff --cached --check
          git commit -m "style: format local LLM runtime tranche"
          git push origin HEAD:ralph/local-llm-p5-runtime-20260831
