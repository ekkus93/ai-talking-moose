name: Whisper macOS Real CPU Acceptance

# Explicit, network-using 488 MB model installation; never part of ordinary CI.
# Real transcription qualifies offline egress ONLY when the manual Seatbelt\n# wrapper and both independent kernel/socket denial proofs succeed on each Mac.\n# This workflow does not exercise a live microphone or physical playback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-macos-real-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-cpu:
    name: Pinned real Whisper Small inference (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      TALKING_MOOSE_REQUIRE_WHISPER_NATIVE: "1"
      CARGO_INCREMENTAL: "0"
      TALKING_MOOSE_ALLOW_LIVE_API: "0"
    steps:
      - name: Check out pinned Whisper source
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Verify exact source and host architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 scripts/check_whisper_provenance.py
          test -f third_party/whisper.cpp/samples/jfk.wav
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mac-whisper-real-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Generate app icons
        run: python3 scripts/generate_app_icons.py
      - name: Build real native-linked acceptance binary
        # Do not require unrelated Moonshine .app frameworks for this CLI.
        # The shipping app configuration is not changed by this override.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --features whisper-acceptance --bin whisper_acceptance
      - name: Run shared Whisper pipeline lifecycle regressions
        # Deterministic mock-engine tests: capture, wake PCM ordering,
        # startup/cancel, worker join, overload and final-delivery contracts.
        # These are additional to, not replacements for, real-model inference.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            asr::pipeline::tests -- --test-threads=1

      - name: Install pinned model and transcribe real JFK corpus
        id: inference
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/debug/whisper_acceptance"
          root="$RUNNER_TEMP/whisper-macos-real-${{ matrix.arch }}"
          model="$root/models/whisper/whisper-small"
          reports="$root/reports"
          mkdir -p "$reports"
          test ! -e "$model"
          file "$binary"
          lipo -archs "$binary" | grep -Fx "${{ matrix.arch }}"
          export TALKING_MOOSE_ACCEPTANCE_HOST_CPU="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || sysctl -n hw.model)"
          "$binary" probe-native
          # Retry only transient HTTPS timeouts. The production installer
          # removes staging data after failure and rechecks the pinned SHA-256
          # before promoting a complete model. Never resume partial downloads.
          for attempt in 1 2 3; do
            rm -f "$reports/install.json"
            if "$binary" install "$model" "$reports/install.json" > "$reports/install-attempt.log" 2>&1; then
              cat "$reports/install-attempt.log"
              break
            fi
            cat "$reports/install-attempt.log" >&2
            if ! grep -Fq 'The Whisper model download timed out.' "$reports/install-attempt.log"; then
              echo "Whisper installer failed for a non-timeout reason; refusing retry" >&2
              exit 1
            fi
            if test -e "$model/ggml-small.bin"; then
              echo "Installer left a model file after timeout; refusing unsafe retry" >&2
              exit 1
            fi
            if test "$attempt" -eq 3; then
              echo "Whisper installer exhausted three timeout attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          rm -f "$reports/install-attempt.log"
          # A clean reinstall must use the same production model lifecycle,
          # without reusing weights left behind from the first installation.
          mv "$reports/install.json" "$reports/install-initial.json"
          "$binary" delete "$model" "$reports/delete-before-reinstall.json"
          test ! -e "$model/ggml-small.bin"
          test ! -e "$model/.talking-moose-model.json"
          # Missing and corrupt model paths must fail before native inference.
          if "$binary" transcribe "$model" third_party/whisper.cpp/samples/jfk.wav "$reports/missing-model.json" > "$root/missing-model.log" 2>&1; then
            echo "Missing Whisper model unexpectedly transcribed audio" >&2
            exit 1
          fi
          grep -Fq 'selected Whisper model is not installed and verified' "$root/missing-model.log"
          test ! -e "$reports/missing-model.json"
          printf 'not-a-model' > "$model/ggml-small.bin"
          if "$binary" transcribe "$model" third_party/whisper.cpp/samples/jfk.wav "$reports/corrupt-model.json" > "$root/corrupt-model.log" 2>&1; then
            echo "Corrupt Whisper model unexpectedly transcribed audio" >&2
            exit 1
          fi
          grep -Fq 'incomplete or corrupt' "$root/corrupt-model.log"
          test ! -e "$reports/corrupt-model.json"
          rm -f "$model/ggml-small.bin" "$root/missing-model.log" "$root/corrupt-model.log"
          "$binary" install "$model" "$reports/install.json"
          # Invoke the inference process under macOS Seatbelt after the
          # explicit verified model installation. The process-level probe
          # requires both kernel sandbox denial and a permission-denied socket
          # connection; a failed network request alone is not acceptable.
          command -v sandbox-exec >/dev/null || {
            echo "macOS Seatbelt sandbox-exec is unavailable; egress acceptance cannot pass" >&2
            exit 1
          }
          sandbox_profile="$root/network-denied.sb"
          cat > "$sandbox_profile" <<'SEATBELT'
          (version 1)
          (allow default)
          (deny network*)
          SEATBELT
          sandbox-exec -f "$sandbox_profile" python3 -c '
          import errno
          import socket
          try:
              with socket.socket() as stream:
                  stream.settimeout(1)
                  stream.connect(("127.0.0.1", 9))
          except OSError as error:
              if error.errno in (errno.EPERM, errno.EACCES):
                  raise SystemExit(0)
              raise SystemExit(f"network probe failed for a non-policy reason: {error.errno}")
          raise SystemExit("Seatbelt did not deny the loopback connection")
          '
          # Capture upstream native diagnostics so real-model acceptance proves
          # the CPU-only baseline rather than silently falling back to Metal.
          native_log="$root/whisper-transcribe-native.log"
          if ! sandbox-exec -f "$sandbox_profile" "$binary" transcribe "$model" third_party/whisper.cpp/samples/jfk.wav "$reports/transcribe.json" --require-network-denied > "$native_log" 2>&1; then
            cat "$native_log" >&2
            exit 1
          fi
          cat "$native_log"
          grep -Fq 'whisper_init_with_params_no_state: use gpu    = 0' "$native_log"
          grep -Fq 'whisper_init_with_params_no_state: flash attn = 0' "$native_log"
          if grep -Fq 'whisper_backend_init_gpu: using' "$native_log"; then
            echo "Native Whisper unexpectedly selected a GPU backend" >&2
            exit 1
          fi
          rm -f "$native_log"
          # A second independent process must reopen the same verified user-data
          # model and produce a real transcript without another download.
          # This is repeated cold-start evidence, not same-session endurance.
          repeat_log="$root/whisper-transcribe-repeat-native.log"
          if ! sandbox-exec -f "$sandbox_profile" "$binary" transcribe "$model" third_party/whisper.cpp/samples/jfk.wav "$reports/transcribe-repeat.json" --require-network-denied > "$repeat_log" 2>&1; then
            cat "$repeat_log" >&2
            exit 1
          fi
          cat "$repeat_log"
          grep -Fq 'whisper_init_with_params_no_state: use gpu    = 0' "$repeat_log"
          grep -Fq 'whisper_init_with_params_no_state: flash attn = 0' "$repeat_log"
          if grep -Fq 'whisper_backend_init_gpu: using' "$repeat_log"; then
            echo "Repeated native Whisper run unexpectedly selected a GPU backend" >&2
            exit 1
          fi
          rm -f "$repeat_log"
          "$binary" delete "$model" "$reports/delete.json"
          test ! -e "$model/ggml-small.bin"
          echo "report_dir=$reports" >> "$GITHUB_OUTPUT"
      - name: Assert genuine model and meaningful transcript
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.inference.outputs.report_dir }}" "$GITHUB_SHA" "${{ matrix.arch }}" <<'PY'
          import json
          import pathlib
          import sys
          root, sha, arch = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          install_initial = json.loads((root / "install-initial.json").read_text())
          delete_before_reinstall = json.loads((root / "delete-before-reinstall.json").read_text())
          install = json.loads((root / "install.json").read_text())
          transcript = json.loads((root / "transcribe.json").read_text())
          repeated = json.loads((root / "transcribe-repeat.json").read_text())
          deletion = json.loads((root / "delete.json").read_text())
          expected_hash = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
          expected_source = "60c0be6ac8fa71b1a2ae2dd938a31a34a508e774"
          assert install_initial["git_sha"] == install["git_sha"] == transcript["git_sha"] == sha
          assert install_initial["disposition"] == install["disposition"] == "installed"
          assert install_initial["production_installer_verified"] is True
          assert install_initial["sha256"] == install["sha256"]
          assert install_initial["revision"] == install["revision"]
          assert delete_before_reinstall["removed"] is True
          assert install["sha256"] == transcript["sha256"] == expected_hash
          assert install["source_commit"] == transcript["source_commit"] == expected_source
          assert install["expected_bytes"] == transcript["expected_bytes"] == 487601967
          assert install["production_installer_verified"] is True
          rust_arch = "aarch64" if arch == "arm64" else arch
          assert transcript["host_arch"] == rust_arch, transcript["host_arch"]
          assert transcript["runtime"]["whisper_native_linked"] is True
          assert transcript["status"] == "pass"
          assert transcript["transcript"]["transcription_ok"] is True
          words = transcript["transcript"]["text"].lower()
          assert all(word in words for word in ("ask", "country", "you")), words
          assert transcript["model_load_wall_ms"] > 0
          assert transcript["same_context_repeat_transcribe_wall_ms"] > 0
          assert transcript["same_context_repeat_transcript"]["transcription_ok"] is True
          same_context_words = transcript["same_context_repeat_transcript"]["text"].lower()
          assert all(word in same_context_words for word in ("ask", "country", "you")), same_context_words
          assert transcript["transcribe_wall_ms"] > 0
          assert transcript["peak_resident_memory_bytes"] > 0
          pipeline = transcript["pipeline"]
          assert pipeline["queue_capacity_chunks"] == 56
          assert pipeline["final_event_count"] == 1
          assert pipeline["partial_event_count"] >= 1
          assert pipeline["first_partial_latency_ms"] is not None
          assert pipeline["first_final_latency_ms"] is not None
          assert pipeline["first_final_latency_ms"] >= pipeline["first_partial_latency_ms"]
          assert pipeline["processed_audio_ms"] > 0
          assert pipeline["inference_wall_time_ms"] > 0
          assert pipeline["overload_attempted_chunks"] == 64

          assert pipeline["overload_dropped_chunks"] > 0
          assert transcript["available_parallelism"] > 0
          assert transcript["configured_inference_threads"] is not None
          assert transcript["configured_inference_threads"] > 0
          print("macOS Whisper configured inference threads:", transcript["configured_inference_threads"])
          print("macOS Whisper direct model load (ms):", transcript["model_load_wall_ms"])
          print("macOS Whisper same-context repeat inference (ms):", transcript["same_context_repeat_transcribe_wall_ms"])
          print("macOS Whisper CPU acceptance metrics:", {key: pipeline[key] for key in (
              "first_partial_latency_ms", "first_final_latency_ms", "real_time_factor",
              "nominal_dropped_chunks", "overload_dropped_chunks")})
          assert transcript["network_denied_required"] is True
          assert transcript["network_denial_probe_passed"] is True
          # Verify the repeated cold start independently: pinned model, no
          # runtime/provider fallback, meaningful text and exactly one final.
          assert repeated["git_sha"] == sha
          assert repeated["sha256"] == expected_hash
          assert repeated["source_commit"] == expected_source
          assert repeated["expected_bytes"] == 487601967
          assert repeated["host_arch"] == rust_arch
          assert repeated["runtime"]["whisper_native_linked"] is True
          assert repeated["status"] == "pass"
          assert repeated["transcript"]["transcription_ok"] is True
          repeat_words = repeated["transcript"]["text"].lower()
          assert all(word in repeat_words for word in ("ask", "country", "you")), repeat_words
          assert repeated["model_load_wall_ms"] > 0
          assert repeated["configured_inference_threads"] == transcript["configured_inference_threads"]
          assert repeated["same_context_repeat_transcribe_wall_ms"] > 0
          assert repeated["same_context_repeat_transcript"]["transcription_ok"] is True
          repeated_same_context_words = repeated["same_context_repeat_transcript"]["text"].lower()
          assert all(word in repeated_same_context_words for word in ("ask", "country", "you")), repeated_same_context_words
          assert repeated["transcribe_wall_ms"] > 0
          assert repeated["peak_resident_memory_bytes"] > 0
          assert repeated["pipeline"]["final_event_count"] == 1
          assert repeated["pipeline"]["partial_event_count"] >= 1
          assert repeated["pipeline"]["queue_capacity_chunks"] == 56
          assert repeated["pipeline"]["nominal_dropped_chunks"] == 0
          # Repeat acceptance must independently verify the same bounded
          # inference/overload contract as the first cold start. Do not let
          # a successful first report mask degraded repeated model execution.
          assert repeated["pipeline"]["first_partial_latency_ms"] is not None
          assert repeated["pipeline"]["first_final_latency_ms"] is not None
          assert repeated["pipeline"]["first_final_latency_ms"] >= repeated["pipeline"]["first_partial_latency_ms"]
          assert repeated["pipeline"]["processed_audio_ms"] > 0
          assert repeated["pipeline"]["inference_wall_time_ms"] > 0
          assert repeated["pipeline"]["overload_attempted_chunks"] == 64
          assert repeated["pipeline"]["overload_dropped_chunks"] > 0
          assert repeated["available_parallelism"] > 0
          assert repeated["configured_inference_threads"] > 0
          assert repeated["network_denied_required"] is True
          assert repeated["network_denial_probe_passed"] is True
          print("Repeated cold-start model load (ms):", repeated["model_load_wall_ms"])
          print("Repeated cold-start inference (ms):", repeated["transcribe_wall_ms"])
          print("Repeated process same-context inference (ms):", repeated["same_context_repeat_transcribe_wall_ms"])
          print("Repeated cold-start pipeline RTF:", repeated["pipeline"]["real_time_factor"])
          assert deletion["removed"] is True
          print("Real pinned-model macOS Whisper transcription verified under Seatbelt network denial; physical mic remains unqualified.")
          PY
      - name: Upload JSON evidence only (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-real-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/whisper-macos-real-${{ matrix.arch }}/reports/*.json
          if-no-files-found: warn
          retention-days: 30
