name: Whisper macOS Real CPU Acceptance

# Explicit, network-using 488 MB model installation; never part of ordinary CI.
# Real transcription here is NOT evidence of denied network egress or a live mic.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-macos-real-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-cpu:
    name: Pinned real Whisper Small inference (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      TALKING_MOOSE_REQUIRE_WHISPER_NATIVE: "1"
      CARGO_INCREMENTAL: "0"
      TALKING_MOOSE_ALLOW_LIVE_API: "0"
    steps:
      - name: Check out pinned Whisper source
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Verify exact source and host architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 scripts/check_whisper_provenance.py
          test -f third_party/whisper.cpp/samples/jfk.wav
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mac-whisper-real-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Generate app icons
        run: python3 scripts/generate_app_icons.py
      - name: Build real native-linked acceptance binary
        # Do not require unrelated Moonshine .app frameworks for this CLI.
        # The shipping app configuration is not changed by this override.
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --features whisper-acceptance --bin whisper_acceptance
      - name: Install pinned model and transcribe real JFK corpus
        id: inference
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/debug/whisper_acceptance"
          root="$RUNNER_TEMP/whisper-macos-real-${{ matrix.arch }}"
          model="$root/models/whisper/whisper-small"
          reports="$root/reports"
          mkdir -p "$reports"
          test ! -e "$model"
          file "$binary"
          lipo -archs "$binary" | grep -Fx "${{ matrix.arch }}"
          export TALKING_MOOSE_ACCEPTANCE_HOST_CPU="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || sysctl -n hw.model)"
          "$binary" probe-native
          # Retry only transient HTTPS timeouts. The production installer
          # removes staging data after failure and rechecks the pinned SHA-256
          # before promoting a complete model. Never resume partial downloads.
          for attempt in 1 2 3; do
            rm -f "$reports/install.json"
            if "$binary" install "$model" "$reports/install.json" > "$reports/install-attempt.log" 2>&1; then
              cat "$reports/install-attempt.log"
              break
            fi
            cat "$reports/install-attempt.log" >&2
            if ! grep -Fq 'The Whisper model download timed out.' "$reports/install-attempt.log"; then
              echo "Whisper installer failed for a non-timeout reason; refusing retry" >&2
              exit 1
            fi
            if test -e "$model/ggml-small.bin"; then
              echo "Installer left a model file after timeout; refusing unsafe retry" >&2
              exit 1
            fi
            if test "$attempt" -eq 3; then
              echo "Whisper installer exhausted three timeout attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          rm -f "$reports/install-attempt.log"
          # Capture upstream native diagnostics so real-model acceptance proves
          # the CPU-only baseline rather than silently falling back to Metal.
          native_log="$root/whisper-transcribe-native.log"
          if ! "$binary" transcribe "$model" third_party/whisper.cpp/samples/jfk.wav "$reports/transcribe.json" > "$native_log" 2>&1; then
            cat "$native_log" >&2
            exit 1
          fi
          cat "$native_log"
          grep -Fq 'whisper_init_with_params_no_state: use gpu    = 0' "$native_log"
          grep -Fq 'whisper_init_with_params_no_state: flash attn = 0' "$native_log"
          if grep -Fq 'whisper_backend_init_gpu: using' "$native_log"; then
            echo "Native Whisper unexpectedly selected a GPU backend" >&2
            exit 1
          fi
          rm -f "$native_log"
          "$binary" delete "$model" "$reports/delete.json"
          test ! -e "$model/ggml-small.bin"
          echo "report_dir=$reports" >> "$GITHUB_OUTPUT"
      - name: Assert genuine model and meaningful transcript
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.inference.outputs.report_dir }}" "$GITHUB_SHA" "${{ matrix.arch }}" <<'PY'
          import json
          import pathlib
          import sys
          root, sha, arch = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          install = json.loads((root / "install.json").read_text())
          transcript = json.loads((root / "transcribe.json").read_text())
          deletion = json.loads((root / "delete.json").read_text())
          expected_hash = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
          expected_source = "60c0be6ac8fa71b1a2ae2dd938a31a34a508e774"
          assert install["git_sha"] == transcript["git_sha"] == sha
          assert install["sha256"] == transcript["sha256"] == expected_hash
          assert install["source_commit"] == transcript["source_commit"] == expected_source
          assert install["expected_bytes"] == transcript["expected_bytes"] == 487601967
          assert install["production_installer_verified"] is True
          rust_arch = "aarch64" if arch == "arm64" else arch
          assert transcript["host_arch"] == rust_arch, transcript["host_arch"]
          assert transcript["runtime"]["whisper_native_linked"] is True
          assert transcript["status"] == "pass"
          assert transcript["transcript"]["transcription_ok"] is True
          words = transcript["transcript"]["text"].lower()
          assert all(word in words for word in ("ask", "country", "you")), words
          assert transcript["transcribe_wall_ms"] > 0
          assert transcript["peak_resident_memory_bytes"] > 0
          assert transcript["network_denied_required"] is False
          assert deletion["removed"] is True
          print("Real pinned-model macOS Whisper transcription verified; egress isolation and physical mic remain unqualified.")
          PY
      - name: Upload JSON evidence only (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-real-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/whisper-macos-real-${{ matrix.arch }}/reports/*.json
          if-no-files-found: warn
          retention-days: 30
