name: Ralph one-shot Local TTS clippy fix

on:
  push:
    branches:
      - ralph/local-tts-post-review-hardening
    paths:
      - .github/workflows/ralph-local-tts-clippy-fix.yml

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ralph/local-tts-post-review-hardening
          fetch-depth: 0

      - name: Apply exact Clippy remediation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/ai/local_tts/runtime/engine.rs')
          text = path.read_text()
          old = '        let shape_values: &[i64] = &**shape;\n'
          new = '        let shape_values: &[i64] = shape;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Clippy target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/ralph-local-tts-clippy-fix.yml
          git diff --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy Clippy waveform shape borrow'
          git push origin HEAD:ralph/local-tts-post-review-hardening
