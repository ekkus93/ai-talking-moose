name: KittenTTS Linux ORT diagnostic

on:
  push:
    branches:
      - ralph/kcr-r4-r5-reconcile-closeout
    paths:
      - ".github/workflows/kittentts-linux-ort-diagnostic.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TALKING_MOOSE_ALLOW_LIVE_API: "0"
  MODEL_FILENAME: kitten_tts_mini_v0_8.onnx
  MODEL_URL: "https://huggingface.co/KittenML/kitten-tts-mini-0.8/resolve/c02725660cea441db4c383af69f1f26f5cd00947/kitten_tts_mini_v0_8.onnx?download=true"
  MODEL_BYTES: "78268016"
  MODEL_SHA256: "0f5bbae4fc4800c98dbc544a87ecfa79510de2fb8222db30d12e5bfe9177df91"
  VOICES_FILENAME: voices.npz
  VOICES_URL: "https://huggingface.co/KittenML/kitten-tts-mini-0.8/resolve/c02725660cea441db4c383af69f1f26f5cd00947/voices.npz?download=true"
  VOICES_BYTES: "3278902"
  VOICES_SHA256: "40ad2638952b77b7b2f30127e2608e169fc69dd256b53bd8aaa3409a33193c42"
  G2P_FILENAME: cmudict_data.json
  G2P_URL: "https://raw.githubusercontent.com/ayutaz/piper-plus/244ffeb44108347a514ebfc0c2f773d938c9613b/src/rust/piper-plus-g2p/data/cmudict_data.json"
  G2P_BYTES: "3748042"
  G2P_SHA256: "f78ed3bfa40146b70b9de78a7c67ef3be6b6c11671bb2a050442f232252a3f01"
  ORT_FILENAME: onnxruntime-linux-x64-1.23.2.tgz
  ORT_URL: "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz"
  ORT_BYTES: "8309231"
  ORT_SHA256: "1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b"

jobs:
  diagnose:
    name: Linux 1-thread ORT diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_ubuntu_apt.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libasound2-dev \
            libayatana-appindicator3-dev libclang-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-linux-x86_64-kittentts-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-x86_64-kittentts-cargo-
            ${{ runner.os }}-kittentts-cargo-

      - name: Restore pinned KittenTTS artifacts
        id: artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kittentts-artifacts
          key: kittentts-linux-x86_64-${{ env.MODEL_SHA256 }}-${{ env.VOICES_SHA256 }}-${{ env.G2P_SHA256 }}-${{ env.ORT_SHA256 }}

      - name: Download and verify frozen KittenTTS artifacts
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACT_DIR="$RUNNER_TEMP/kittentts-artifacts"
          python3 - <<'PY'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          specs = [
              ("MODEL_FILENAME", "MODEL_URL", "MODEL_BYTES", "MODEL_SHA256"),
              ("VOICES_FILENAME", "VOICES_URL", "VOICES_BYTES", "VOICES_SHA256"),
              ("G2P_FILENAME", "G2P_URL", "G2P_BYTES", "G2P_SHA256"),
              ("ORT_FILENAME", "ORT_URL", "ORT_BYTES", "ORT_SHA256"),
          ]
          for filename_key, url_key, bytes_key, sha_key in specs:
              path = root / os.environ[filename_key]
              if not path.exists():
                  with urllib.request.urlopen(os.environ[url_key], timeout=120) as response:
                      path.write_bytes(response.read())
              data = path.read_bytes()
              expected_bytes = int(os.environ[bytes_key])
              expected_sha = os.environ[sha_key]
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected_bytes or actual_sha != expected_sha:
                  raise SystemExit(
                      f"artifact verification failed for {path.name}: "
                      f"bytes={len(data)} sha256={actual_sha}"
                  )
              print(f"verified {path.name} bytes={len(data)} sha256={actual_sha}")
          PY

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Expose native ORT failure in runner checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/ai/local_tts/runtime/engine.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            Err(_) => return Err(LocalTtsRuntimeError::inference()),
'''
          new = '''            Err(error) => {
                eprintln!("KITTENTTS_ORT_DIAGNOSTIC stage=session_run error={error:?}");
                return Err(LocalTtsRuntimeError::inference());
            }
'''
          marker = '''        let outputs = match run_result {
'''
          start = text.index(marker)
          end = text.index("        };", start)
          block = text[start:end]
          if block.count(old) != 1:
              raise SystemExit("expected exactly one inference sanitizer in run_result block")
          text = text[:start] + block.replace(old, new) + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- src-tauri/src/ai/local_tts/runtime/engine.rs

      - name: Run exact failing 1/2/4-thread sweep with native ORT diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export KTT301_MODEL_PATH="$RUNNER_TEMP/kittentts-artifacts/$MODEL_FILENAME"
          export KTT301_VOICES_PATH="$RUNNER_TEMP/kittentts-artifacts/$VOICES_FILENAME"
          export KTT301_G2P_PATH="$RUNNER_TEMP/kittentts-artifacts/$G2P_FILENAME"
          export KTT301_ORT_ARCHIVE_PATH="$RUNNER_TEMP/kittentts-artifacts/$ORT_FILENAME"
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --lib \
            'ai::local_tts::runtime::engine::tests::real_kittentts_cpu_thread_sweep' \
            -- \
            --ignored \
            --exact \
            --nocapture \
            --test-threads=1
