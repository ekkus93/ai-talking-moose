name: P4 Source Transport

on:
  push:
    branches:
      - master
    paths:
      - ".transport/p4/**"
      - ".github/workflows/p4-transport.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and apply validated P4 patch
        shell: bash
        run: |
          set -euo pipefail

          cat .transport/p4/part-* > /tmp/p4.patch.b64
          base64 -d /tmp/p4.patch.b64 > /tmp/p4.patch.gz
          echo "a72fca06c4d8c9c8ac6d5031fa8dff1380d7c7fc566bc9e5cc044edef9f6fbb9  /tmp/p4.patch.gz" | sha256sum -c -

          gzip -dc /tmp/p4.patch.gz > /tmp/p4.patch
          echo "e2b32a0b86b898343289729e15f9ecdf4f019fafee6f4f1a43332271a98e2d3b  /tmp/p4.patch" | sha256sum -c -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git apply --3way /tmp/p4.patch

          rm -rf .transport/p4
          rm -f .github/workflows/p4-transport.yml
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "P4 transport unexpectedly produced no source changes" >&2
            exit 1
          fi

          git commit -m "p4: complete Gemini Live protocol correctness"
          git push origin HEAD:master
