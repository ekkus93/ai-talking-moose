name: Ralph Wake Packaging

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-packaging.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - name: Apply deterministic wake packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f"{path}: missing replacement: {old[:140]!r}")
              p.write_text(text.replace(old,new,count))

          # Preserve the verified static archive for Cargo rather than discarding it.
          p=Path('scripts/prepare_wake_word_artifacts.py')
          text=p.read_text().replace('import tempfile\n','')
          old='''    runtime = manifest["runtime_archives"][args.platform]\n    release_url = (\n        "https://github.com/k2-fsa/sherpa-onnx/releases/download/"\n        f"v{manifest['sherpa_version']}/{runtime['filename']}"\n    )\n    with tempfile.TemporaryDirectory(prefix="wake-runtime-") as temporary:\n        archive = Path(temporary) / runtime["filename"]\n        download(release_url, archive)\n        verify(archive, runtime["bytes"], runtime["sha256"])\n        if runtime_root.exists():\n            shutil.rmtree(runtime_root)\n        safe_extract_tar_bz2(archive, runtime_root)\n\n    evidence = {\n'''
          new='''    runtime = manifest["runtime_archives"][args.platform]\n    release_url = (\n        "https://github.com/k2-fsa/sherpa-onnx/releases/download/"\n        f"v{manifest['sherpa_version']}/{runtime['filename']}"\n    )\n    runtime_archive_root = destination / "runtime-archive"\n    runtime_archive_root.mkdir(parents=True, exist_ok=True)\n    archive = runtime_archive_root / runtime["filename"]\n    if not archive.exists():\n        download(release_url, archive)\n    verify(archive, runtime["bytes"], runtime["sha256"])\n    if runtime_root.exists():\n        shutil.rmtree(runtime_root)\n    safe_extract_tar_bz2(archive, runtime_root)\n\n    evidence = {\n'''
          if old not in text: raise SystemExit('prepare script runtime block missing')
          text=text.replace(old,new,1)
          text=text.replace('''        "runtime_archive_verified": True,\n''','''        "runtime_archive_verified": True,\n        "runtime_archive_filename": runtime["filename"],\n''')
          p.write_text(text)

          # Bundle the manifest/notices/model directory under the same resource path used at runtime.
          p=Path('src-tauri/tauri.conf.json'); data=json.loads(p.read_text())
          resources=data['bundle']['resources']
          if 'resources/wake_word/' not in resources:
              resources.append('resources/wake_word/')
          p.write_text(json.dumps(data, indent=2)+'\n')
          model_dir=Path('src-tauri/resources/wake_word/model'); model_dir.mkdir(parents=True,exist_ok=True)
          (model_dir/'.gitkeep').write_text('Prepared pinned model files are staged here by release/acceptance workflows.\n')
          Path('src-tauri/resources/wake_word/THIRD_PARTY_NOTICES.md').write_text('''# Wake Word V1 third-party notices\n\n- **sherpa-onnx 1.13.8** — Apache-2.0. The linked Rust/native dependency license text is collected into the generated release dependency inventory.\n- **openEuler/sherpa-kws model**, revision `b73da3087e40072f6251351acd5f54a8c563bd11` — Apache-2.0 according to the immutable model card selected for Wake Word V1. Exact model file hashes are recorded in `artifacts-v1.json`.\n\nWake Word model files are bundled for local/offline inference. They are accepted only after the preparation script verifies their frozen byte sizes and SHA-256 values.\n''')

          # Require sherpa license evidence in generated inventory.
          replace('scripts/collect_release_licenses.py',
              '''REQUIRED_LOCAL_TTS_CARGO = {\n    "ort": "2.0.0-rc.13",\n    "piper-plus-g2p": "0.4.0",\n}\n''',
              '''REQUIRED_LOCAL_TTS_CARGO = {\n    "ort": "2.0.0-rc.13",\n    "piper-plus-g2p": "0.4.0",\n}\nREQUIRED_WAKE_CARGO = {\n    "sherpa-onnx": "1.13.8",\n}\n''')
          replace('scripts/collect_release_licenses.py',
              '''    validate_required_cargo_rows(cargo, REQUIRED_LOCAL_TTS_CARGO, "Local TTS")\n''',
              '''    validate_required_cargo_rows(cargo, REQUIRED_LOCAL_TTS_CARGO, "Local TTS")\n    validate_required_cargo_rows(cargo, REQUIRED_WAKE_CARGO, "Wake Word")\n''')
          replace('scripts/collect_release_licenses.py',
              '"required_local_llm=2 required_local_tts=2"',
              '"required_local_llm=2 required_local_tts=2 required_wake=1"')

          # macOS bundle verification re-hashes every bundled wake model artifact and checks notices.
          marker='''if find "$app_path" -type f -iname '*.gguf' -print -quit | grep -q .; then\n'''
          block='''wake_root="$app_path/Contents/Resources/resources/wake_word"\nwake_manifest="$wake_root/artifacts-v1.json"\nwake_model="$wake_root/model"\n[[ -f "$wake_manifest" ]] || fail "Wake Word artifact manifest is missing from bundle"\n[[ -f "$wake_root/THIRD_PARTY_NOTICES.md" ]] || fail "Wake Word third-party notices are missing from bundle"\npython3 - "$wake_manifest" "$wake_model" <<'PY_WAKE'\nimport hashlib, json, pathlib, sys\nmanifest = json.load(open(sys.argv[1], encoding="utf-8"))\nroot = pathlib.Path(sys.argv[2])\nfor artifact in manifest["model_artifacts"]:\n    path = root / artifact["path"]\n    if not path.is_file():\n        raise SystemExit(f"bundled Wake Word artifact missing: {artifact['path']}")\n    if path.stat().st_size != artifact["bytes"]:\n        raise SystemExit(f"bundled Wake Word artifact size mismatch: {artifact['path']}")\n    digest = hashlib.sha256(path.read_bytes()).hexdigest()\n    if digest != artifact["sha256"]:\n        raise SystemExit(f"bundled Wake Word artifact digest mismatch: {artifact['path']}")\nprint("wake-word-bundle-model-hashes-ok")\nPY_WAKE\ngrep -F '| cargo | `sherpa-onnx` | `1.13.8` |' "$dependency_inventory" >/dev/null \\\n  || fail "sherpa-onnx is missing from bundled dependency license inventory"\n\n'''
          replace('scripts/verify_macos_bundle.sh', marker, block+marker)

          # Shared build-preparation snippet insertion helper.
          def insert_after(path, needle, addition, occurrences=None):
              p=Path(path); t=p.read_text(); n=t.count(needle)
              if n == 0: raise SystemExit(f'{path}: needle missing')
              if occurrences is not None and n != occurrences: raise SystemExit(f'{path}: expected {occurrences} occurrences, got {n}')
              p.write_text(t.replace(needle, needle+addition))

          # Ordinary full-validation macOS bundle in ci.yml.
          needle='''      - name: Build pinned Moonshine native runtime\n        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"\n'''
          addition='''      - name: Prepare pinned Wake Word model and sherpa runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          platform="macos-${{ matrix.arch }}"\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform "$platform"\n          rm -rf src-tauri/resources/wake_word/model\n          cp -R "$destination/model" src-tauri/resources/wake_word/model\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n'''
          insert_after('.github/workflows/ci.yml', needle, addition, 1)
          # Include helper syntax check.
          replace('.github/workflows/ci.yml',
              '''            scripts/measure_local_llm_bundle_impact.py\n''',
              '''            scripts/measure_local_llm_bundle_impact.py \\\n            scripts/prepare_wake_word_artifacts.py\n''')

          # Exact-head full validation: canonical Linux build + mac bundle builds.
          replace('.github/workflows/full-validation-label.yml',
              '''      - name: Generate application icon set\n        run: python3 scripts/generate_app_icons.py\n      - name: Run literal canonical repository gate\n''',
              '''      - name: Generate application icon set\n        run: python3 scripts/generate_app_icons.py\n      - name: Prepare pinned Wake Word build runtime\n        shell: bash\n        run: |\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform linux-x86_64\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n      - name: Run literal canonical repository gate\n''')
          needle='''      - name: Prepare pinned Moonshine native runtime\n        if: steps.moonshine-cache.outputs.cache-hit != 'true'\n        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"\n'''
          addition='''      - name: Prepare pinned Wake Word model and sherpa runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          platform="macos-${{ matrix.arch }}"\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform "$platform"\n          rm -rf src-tauri/resources/wake_word/model\n          cp -R "$destination/model" src-tauri/resources/wake_word/model\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n'''
          insert_after('.github/workflows/full-validation-label.yml', needle, addition, 1)
          replace('.github/workflows/full-validation-label.yml',
              '''            scripts/measure_local_llm_bundle_impact.py\n''',
              '''            scripts/measure_local_llm_bundle_impact.py \\\n            scripts/prepare_wake_word_artifacts.py\n''')

          # Tagged release source gate gets verified Linux archive before any Rust/frontend contract build.
          replace('.github/workflows/release.yml',
              '''      - name: Generate release icon set\n        run: python3 scripts/generate_app_icons.py\n\n      - name: Validate tag and release metadata\n''',
              '''      - name: Generate release icon set\n        run: python3 scripts/generate_app_icons.py\n\n      - name: Prepare pinned Wake Word build runtime\n        shell: bash\n        run: |\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform linux-x86_64\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n\n      - name: Validate tag and release metadata\n''',1)
          # Tagged mac build stages model and exact target archive.
          needle='''      - name: Build pinned Moonshine native runtime\n        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"\n'''
          addition='''      - name: Prepare pinned Wake Word model and sherpa runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          platform="macos-${{ matrix.arch }}"\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform "$platform"\n          rm -rf src-tauri/resources/wake_word/model\n          cp -R "$destination/model" src-tauri/resources/wake_word/model\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n'''
          insert_after('.github/workflows/release.yml', needle, addition, 1)
          replace('.github/workflows/release.yml',
              '''            scripts/measure_local_llm_bundle_impact.py\n''',
              '''            scripts/measure_local_llm_bundle_impact.py \\\n            scripts/prepare_wake_word_artifacts.py\n''')
          PY
          python3 -m py_compile scripts/prepare_wake_word_artifacts.py scripts/collect_release_licenses.py
          bash -n scripts/verify_macos_bundle.sh
          rm .github/workflows/ralph-wake-package-inventory.yml
          rm .github/workflows/ralph-wake-fixture-probe.yml
          rm .github/workflows/ralph-wake-packaging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts src-tauri/tauri.conf.json src-tauri/resources/wake_word .github/workflows/ci.yml .github/workflows/full-validation-label.yml .github/workflows/release.yml .github/workflows/ralph-wake-package-inventory.yml .github/workflows/ralph-wake-fixture-probe.yml .github/workflows/ralph-wake-packaging.yml
          git commit -m "build: make Wake Word packaging deterministic"
          git push origin HEAD:ralph/wake-word-v1-core
