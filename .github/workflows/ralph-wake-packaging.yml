name: Ralph Wake Packaging

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-packaging.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - name: Apply deterministic wake packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{path}: missing replacement {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def insert_before_step(path, marker, block, occurrence=1):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              hits = [i for i, line in enumerate(lines) if line.rstrip() == marker]
              if len(hits) < occurrence:
                  raise SystemExit(f"{path}: missing step marker {marker!r}")
              idx = hits[occurrence - 1]
              lines[idx:idx] = block.splitlines(keepends=True)
              p.write_text(''.join(lines))

          def insert_after_step(path, marker, block, occurrence=1):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              hits = [i for i, line in enumerate(lines) if line.rstrip() == marker]
              if len(hits) < occurrence:
                  raise SystemExit(f"{path}: missing step marker {marker!r}")
              start = hits[occurrence - 1]
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith('      - name:'):
                      end = i
                      break
              lines[end:end] = block.splitlines(keepends=True)
              p.write_text(''.join(lines))

          runtime = Path('src-tauri/src/audio/wake_word/runtime.rs')
          text = runtime.read_text().replace('vec![1, 0; 1600]', 'vec![1_u8, 0_u8].repeat(1600)')
          runtime.write_text(text)

          p = Path('scripts/prepare_wake_word_artifacts.py')
          text = p.read_text().replace('import tempfile\n', '')
          old = '''    runtime = manifest["runtime_archives"][args.platform]\n    release_url = (\n        "https://github.com/k2-fsa/sherpa-onnx/releases/download/"\n        f"v{manifest['sherpa_version']}/{runtime['filename']}"\n    )\n    with tempfile.TemporaryDirectory(prefix="wake-runtime-") as temporary:\n        archive = Path(temporary) / runtime["filename"]\n        download(release_url, archive)\n        verify(archive, runtime["bytes"], runtime["sha256"])\n        if runtime_root.exists():\n            shutil.rmtree(runtime_root)\n        safe_extract_tar_bz2(archive, runtime_root)\n\n    evidence = {\n'''
          new = '''    runtime = manifest["runtime_archives"][args.platform]\n    release_url = (\n        "https://github.com/k2-fsa/sherpa-onnx/releases/download/"\n        f"v{manifest['sherpa_version']}/{runtime['filename']}"\n    )\n    runtime_archive_root = destination / "runtime-archive"\n    runtime_archive_root.mkdir(parents=True, exist_ok=True)\n    archive = runtime_archive_root / runtime["filename"]\n    if not archive.exists():\n        download(release_url, archive)\n    verify(archive, runtime["bytes"], runtime["sha256"])\n    if runtime_root.exists():\n        shutil.rmtree(runtime_root)\n    safe_extract_tar_bz2(archive, runtime_root)\n\n    evidence = {\n'''
          if old not in text:
              raise SystemExit('prepare_wake_word_artifacts.py: runtime block missing')
          text = text.replace(old, new, 1)
          text = text.replace('''        "runtime_archive_verified": True,\n''', '''        "runtime_archive_verified": True,\n        "runtime_archive_filename": runtime["filename"],\n''', 1)
          p.write_text(text)

          p = Path('src-tauri/tauri.conf.json')
          data = json.loads(p.read_text())
          resources = data['bundle'].setdefault('resources', [])
          if 'resources/wake_word/' not in resources:
              resources.append('resources/wake_word/')
          p.write_text(json.dumps(data, indent=2) + '\n')
          model_dir = Path('src-tauri/resources/wake_word/model')
          model_dir.mkdir(parents=True, exist_ok=True)
          (model_dir / '.gitkeep').write_text('Pinned Wake Word model files are staged here by qualified build workflows.\n')
          Path('src-tauri/resources/wake_word/THIRD_PARTY_NOTICES.md').write_text('''# Wake Word V1 third-party notices\n\n- **sherpa-onnx 1.13.8** — Apache-2.0. Linked Rust/native dependency license evidence is included in the generated release dependency inventory.\n- **openEuler/sherpa-kws**, immutable revision `b73da3087e40072f6251351acd5f54a8c563bd11` — Apache-2.0 according to the selected immutable model card. Exact model file sizes and SHA-256 values are frozen in `artifacts-v1.json`.\n\nThe Wake Word model is bundled for local/offline inference only after `prepare_wake_word_artifacts.py` verifies every frozen byte size and SHA-256 value.\n''')

          replace_once('scripts/collect_release_licenses.py',
              '''REQUIRED_LOCAL_TTS_CARGO = {\n    "ort": "2.0.0-rc.13",\n    "piper-plus-g2p": "0.4.0",\n}\n''',
              '''REQUIRED_LOCAL_TTS_CARGO = {\n    "ort": "2.0.0-rc.13",\n    "piper-plus-g2p": "0.4.0",\n}\nREQUIRED_WAKE_CARGO = {\n    "sherpa-onnx": "1.13.8",\n}\n''')
          replace_once('scripts/collect_release_licenses.py',
              '''    validate_required_cargo_rows(cargo, REQUIRED_LOCAL_TTS_CARGO, "Local TTS")\n''',
              '''    validate_required_cargo_rows(cargo, REQUIRED_LOCAL_TTS_CARGO, "Local TTS")\n    validate_required_cargo_rows(cargo, REQUIRED_WAKE_CARGO, "Wake Word")\n''')
          replace_once('scripts/collect_release_licenses.py',
              '"required_local_llm=2 required_local_tts=2"',
              '"required_local_llm=2 required_local_tts=2 required_wake=1"')

          marker = '''if find "$app_path" -type f -iname '*.gguf' -print -quit | grep -q .; then\n'''
          block = '''wake_root="$app_path/Contents/Resources/resources/wake_word"\nwake_manifest="$wake_root/artifacts-v1.json"\nwake_model="$wake_root/model"\n[[ -f "$wake_manifest" ]] || fail "Wake Word artifact manifest is missing from bundle"\n[[ -f "$wake_root/THIRD_PARTY_NOTICES.md" ]] || fail "Wake Word third-party notices are missing from bundle"\npython3 - "$wake_manifest" "$wake_model" <<'PY_WAKE'\nimport hashlib, json, pathlib, sys\nmanifest = json.load(open(sys.argv[1], encoding="utf-8"))\nroot = pathlib.Path(sys.argv[2])\nfor artifact in manifest["model_artifacts"]:\n    path = root / artifact["path"]\n    if not path.is_file():\n        raise SystemExit(f"bundled Wake Word artifact missing: {artifact['path']}")\n    if path.stat().st_size != artifact["bytes"]:\n        raise SystemExit(f"bundled Wake Word artifact size mismatch: {artifact['path']}")\n    digest = hashlib.sha256(path.read_bytes()).hexdigest()\n    if digest != artifact["sha256"]:\n        raise SystemExit(f"bundled Wake Word artifact digest mismatch: {artifact['path']}")\nprint("wake-word-bundle-model-hashes-ok")\nPY_WAKE\ngrep -F '| cargo | `sherpa-onnx` | `1.13.8` |' "$dependency_inventory" >/dev/null \\\n  || fail "sherpa-onnx is missing from bundled dependency license inventory"\n\n'''
          replace_once('scripts/verify_macos_bundle.sh', marker, block + marker)

          linux_prepare = '''      - name: Prepare pinned Wake Word build runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform linux-x86_64\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n'''
          mac_prepare = '''      - name: Prepare pinned Wake Word model and sherpa runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          platform="macos-${{ matrix.arch }}"\n          destination="$RUNNER_TEMP/wake-word"\n          python3 scripts/prepare_wake_word_artifacts.py --destination "$destination" --platform "$platform"\n          rm -rf src-tauri/resources/wake_word/model\n          cp -R "$destination/model" src-tauri/resources/wake_word/model\n          echo "SHERPA_ONNX_ARCHIVE_DIR=$destination/runtime-archive" >> "$GITHUB_ENV"\n'''

          insert_before_step('.github/workflows/ci.yml', '      - name: Run canonical repository gate', linux_prepare)
          insert_after_step('.github/workflows/ci.yml', '      - name: Build pinned Moonshine native runtime', mac_prepare)
          insert_before_step('.github/workflows/full-validation-label.yml', '      - name: Run literal canonical repository gate', linux_prepare)
          insert_after_step('.github/workflows/full-validation-label.yml', '      - name: Prepare pinned Moonshine native runtime', mac_prepare)
          insert_before_step('.github/workflows/release.yml', '      - name: Validate tag and release metadata', linux_prepare, occurrence=1)
          insert_after_step('.github/workflows/release.yml', '      - name: Build pinned Moonshine native runtime', mac_prepare)

          for path in ('.github/workflows/ci.yml', '.github/workflows/full-validation-label.yml', '.github/workflows/release.yml'):
              p = Path(path)
              text = p.read_text()
              anchor = '            scripts/measure_local_llm_bundle_impact.py'
              idx = text.find(anchor)
              if idx >= 0 and 'scripts/prepare_wake_word_artifacts.py' not in text[idx:idx+200]:
                  text = text[:idx] + anchor + ' \\\n            scripts/prepare_wake_word_artifacts.py' + text[idx+len(anchor):]
                  p.write_text(text)
          PY
          python3 -m py_compile scripts/prepare_wake_word_artifacts.py scripts/collect_release_licenses.py
          bash -n scripts/verify_macos_bundle.sh
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -f .github/workflows/ralph-wake-package-inventory.yml
          rm -f .github/workflows/ralph-wake-fixture-probe.yml
          rm -f .github/workflows/ralph-wake-packaging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "build: make Wake Word packaging deterministic"
          git push origin HEAD:ralph/wake-word-v1-core
