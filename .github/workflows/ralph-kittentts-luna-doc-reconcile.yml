name: Ralph one-shot KittenTTS Luna docs reconciliation

on:
  push:
    branches:
      - ralph/kittentts-luna-doc-reconcile
    paths:
      - .github/workflows/ralph-kittentts-luna-doc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ralph/kittentts-luna-doc-reconcile
          fetch-depth: 0

      - name: Apply exact docs reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          MASTER = "96ff21e17b02aa0e3b5d8d783bd09400297eaaa4"
          PR_HEAD = "4a8bf77e4803b7898c717a3cbe145f9df9600c75"

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one occurrence of {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Legacy reconciliation: update KTT-805 from open owner-only work to V1 ASR-proxy closeout.
          legacy = "docs/KITTENTTS_LEGACY_TODO_RECONCILIATION_2026-09-12.md"
          replace_once(
              legacy,
              "**Final closeout master:** `ddce257ce539806c83b41ed916a38b9d7adc7a41`\n",
              "**Final closeout master:** `ddce257ce539806c83b41ed916a38b9d7adc7a41`\n"
              "**V1 ASR-proxy default closeout master:** `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`\n"
              "**Selected V1 Local default:** `Luna`\n",
          )
          replace_once(
              legacy,
              "This document reconciles the older KTT tracker without rewriting its historical task log. Treat this document plus the closeout TODO and evidence record as the authoritative status for KittenTTS closeout. The technical closeout gates completed through PR #101 and the final documentation bookkeeping completed through PR #102; only the owner-only `KCR-330` / `KTT-805` human voice audition/default selection remains open.\n",
              "This document reconciles the older KTT tracker without rewriting its historical task log. Treat this document plus the closeout TODO and evidence record as the authoritative status for KittenTTS closeout. The technical closeout gates completed through PR #101 and the final documentation bookkeeping completed through PR #102. Later, PR #114 added the automated ASR voice-audition proxy and PR #115 selected `Luna` as the V1 Local KittenTTS default by owner-approved ASR proxy evidence.\n",
          )
          replace_once(
              legacy,
              "- Do not mark owner-only human audition/default voice selection complete from automated ASR evidence.\n",
              "- Do not describe owner-approved ASR proxy evidence as subjective human listening evidence.\n",
          )
          replace_once(
              legacy,
              "| KTT-805 | Open / owner-only | Automated ASR smoke passed all eight voices, but human audition/default Local voice selection remains required. |\n",
              "| KTT-805 | Complete for V1 by owner-approved ASR proxy | PR #114 added the automated all-eight-voice ASR audition proxy. PR #115 accepted its deterministic recommendation and changed the V1 Local default to `Luna`; this is not subjective human listening evidence. |\n",
          )
          replace_once(legacy, "## Items that must remain explicitly open\n", "## Remaining caveats and bounded evidence\n")
          legacy_text = Path(legacy).read_text(encoding="utf-8")
          old_block = """### KCR-330 / KTT-805 — human Local voice audition/default choice\n\nAutomated ASR smoke passed for all eight Kitten voices, but it only demonstrates machine-recognizable intelligibility under the smoke-test phrase and thresholds. It does not decide:\n\n- best Moose comedic fit;\n- naturalness;\n- timbre;\n- fatigue over repeated playback;\n- artifact/noise acceptability;\n- final default Local voice.\n\nThis remains an owner decision.\n\n"""
          new_block = """### KCR-330 / KTT-805 — V1 Local default selected by owner-approved ASR proxy\n\n`KCR-330` / `KTT-805` is closed for V1 by owner-approved ASR proxy evidence. The accepted V1 Local KittenTTS default is `Luna`.\n\nEvidence:\n\n- PR #114 head `037a0f0a61e13c76ddc0f9a16ef88adb2f38f141`, ASR voice audition run `34821757481` — PASS.\n- PR #114 post-merge master `21fac6785f008b1d5ab7f46e9125c76ca4c087ad`, ASR voice audition run `34848251323` — PASS.\n- PR #115 head `4a8bf77e4803b7898c717a3cbe145f9df9600c75`, ordinary CI `34853091162`, production CPU acceptance `34853091150`, ASR smoke `34853091234`, and ASR voice audition `34853091230` — PASS.\n- PR #115 post-merge master `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`, ordinary CI `34854193904`, production CPU acceptance `34854193873`, ASR smoke `34854193869`, and ASR voice audition `34854193968` — PASS.\n\nThis is not subjective human listening evidence. It does not prove best Moose comedic fit, timbre preference, naturalness, fatigue, or real-speaker character fit. A future subjective pass can still override `Luna`, but that is no longer a V1 closeout blocker.\n\n"""
          if old_block not in legacy_text:
              raise SystemExit("legacy: KTT-805 open block not found")
          Path(legacy).write_text(legacy_text.replace(old_block, new_block, 1), encoding="utf-8")
          replace_once(
              legacy,
              "Treat KTT-1000 through KTT-1003 as complete for the technical closeout. Continue treating `KCR-330` / `KTT-805` as owner-only open work until human audition selects the final Local KittenTTS default voice.\n",
              "Treat KTT-1000 through KTT-1003 as complete for the technical closeout. Treat `KCR-330` / `KTT-805` as complete for V1 by owner-approved ASR proxy evidence after PR #115 selected `Luna` and exact PR-head plus post-merge validation passed. Do not describe that closeout as subjective human listening.\n",
          )

          # Closeout remediation TODO: update the top status and the formerly only-open item.
          todo = "docs/KITTENTTS_CLOSEOUT_REMEDIATION_TODO_2026-09-12.md"
          replace_once(
              todo,
              "**Closeout merged master SHA:** `79423e8cc0ad48e796e964dee7eb51c3a440ddc4`\n**Status:** Technical closeout complete on master. Human voice audition/default selection remains owner-only and open.\n",
              "**Closeout merged master SHA:** `79423e8cc0ad48e796e964dee7eb51c3a440ddc4`\n"
              "**ASR-proxy voice audition PR:** `#114`\n"
              "**Default voice closeout PR:** `#115`\n"
              "**Default voice closeout master SHA:** `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`\n"
              "**Selected V1 Local default:** `Luna`\n"
              "**Status:** Complete for V1. Local default voice selected by owner-approved ASR proxy evidence; subjective listening not claimed.\n",
          )
          replace_once(
              todo,
              "This TODO is the finite remediation queue for issues found during the post-KittenTTS code review. The core Local TTS implementation is present and the technical closeout has been implemented, CI-qualified, real-model-qualified, guarded-merged, and exact-master-verified.\n\nDo not mark KCR-330 / KTT-805 complete from automated ASR alone. Human voice audition/default selection remains owner-only.\n",
              "This TODO is the finite remediation queue for issues found during the post-KittenTTS code review. The core Local TTS implementation is present and the technical closeout has been implemented, CI-qualified, real-model-qualified, guarded-merged, and exact-master-verified. Later PR #114 added an automated ASR voice-audition proxy, and PR #115 selected `Luna` as the V1 Local default by owner-approved ASR proxy evidence.\n\nDo not describe the `KCR-330` / `KTT-805` closeout as subjective human listening. Human listening was not performed; the V1 default was selected by explicit owner-approved ASR proxy.\n",
          )
          replacements = {
              "- [x] Do not claim human voice acceptance from ASR evidence.\n": "- [x] Do not claim subjective human listening from ASR evidence.\n",
              "- [x] Keep KCR-330 open and explicitly labeled human-only.\n": "- [x] Record the original KCR-330 deferral and the later PR #115 V1 ASR-proxy closeout truthfully.\n",
              "- [x] Record that KTT-805 remains owner-only/open.\n": "- [x] Record that KTT-805 was originally owner-only/open and later closed for V1 by owner-approved ASR proxy evidence.\n",
              "- [x] Document that human KCR-330/KTT-805 voice-quality acceptance remains open.\n": "- [x] Document that KCR-330/KTT-805 was originally deferred and later closed for V1 by owner-approved ASR proxy evidence.\n",
              "- [x] Record that KCR-330 / KTT-805 human audition remains open.\n": "- [x] Record that KCR-330 / KTT-805 was originally deferred, then closed for V1 by PR #115 owner-approved ASR proxy evidence.\n",
              "- [x] No mandatory defect from the closeout spec remains unresolved except the human-only KCR-330/KTT-805 gate.\n": "- [x] No mandatory defect from the closeout spec remains unresolved for V1; KCR-330/KTT-805 was later closed by owner-approved ASR proxy evidence.\n",
              "- [x] KCR-330/KTT-805 human audition/default selection remains open unless owner explicitly completes it.\n": "- [x] KCR-330/KTT-805 default selection is closed for V1 by owner-approved ASR proxy evidence, without claiming subjective listening.\n",
          }
          for old, new in replacements.items():
              replace_once(todo, old, new)
          todo_text = Path(todo).read_text(encoding="utf-8")
          old_tail = """## Only remaining open item\n\n`KCR-330` / `KTT-805` is intentionally open and owner-only: audition real Local KittenTTS voices and choose the default Moose Local TTS voice. This is not a technical CI/code closeout blocker.\n"""
          new_tail = """## Final V1 voice-selection closeout\n\n`KCR-330` / `KTT-805` is closed for V1 by owner-approved ASR proxy evidence. PR #115 changed `DEFAULT_LOCAL_TTS_VOICE` from `Bella` to `Luna`, synced the generated backend contract and runtime test expectation, and recorded the evidence boundary in voice-selection docs. Exact PR-head validation passed on `4a8bf77e4803b7898c717a3cbe145f9df9600c75`: CI `34853091162`, production CPU acceptance `34853091150`, ASR intelligibility smoke `34853091234`, and ASR voice audition `34853091230`. Exact post-merge `master` validation passed on `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`: CI `34854193904`, production CPU acceptance `34854193873`, ASR intelligibility smoke `34854193869`, and ASR voice audition `34854193968`.\n\nThis closeout is not subjective human listening evidence. Future human listening can replace `Luna`, but that would be a new override decision rather than remaining V1 closeout work.\n"""
          if old_tail not in todo_text:
              raise SystemExit("todo: old only-remaining-open tail not found")
          Path(todo).write_text(todo_text.replace(old_tail, new_tail, 1), encoding="utf-8")

          # Evidence doc: add PR #115 evidence and update final decision.
          evidence = "docs/KITTENTTS_CLOSEOUT_EVIDENCE_2026-09-12.md"
          replace_once(
              evidence,
              "**Closeout PR #101 merged master SHA:** `79423e8cc0ad48e796e964dee7eb51c3a440ddc4`.\n\nThis document records what was actually tested and what remains deliberately deferred. It must not be used to mark the owner-only human voice-quality decision complete.\n",
              "**Closeout PR #101 merged master SHA:** `79423e8cc0ad48e796e964dee7eb51c3a440ddc4`.\n"
              "**ASR-proxy voice audition PR #114 merged master SHA:** `21fac6785f008b1d5ab7f46e9125c76ca4c087ad`.\n"
              "**Default voice closeout PR #115 merged master SHA:** `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`.\n"
              "**Selected V1 Local default:** `Luna`.\n\n"
              "This document records what was actually tested and what remains deliberately caveated. It may be used to mark `KCR-330` / `KTT-805` complete for V1 only as an owner-approved ASR proxy decision, not as subjective human listening evidence.\n",
          )
          replace_once(
              evidence,
              "This is automated intelligibility evidence only. It does not decide the default Local voice, naturalness, comedic fit, timbre, fatigue, or artifact acceptability.\n",
              "This was initially automated intelligibility evidence only. PR #114 later added a dedicated ASR voice-audition proxy, and PR #115 used the owner-approved proxy recommendation to select `Luna` as the V1 Local default. This still does not prove subjective naturalness, comedic fit, timbre, fatigue, or artifact acceptability.\n",
          )
          evidence_text = Path(evidence).read_text(encoding="utf-8")
          marker = "---\n\n## Final closeout decision\n"
          insert = """---\n\n## ASR-proxy default voice closeout evidence\n\nPR #114 added `.github/workflows/kittentts-asr-voice-audition.yml`, which converts the all-eight-voice KittenTTS-to-Moonshine Tiny round-trip into a deterministic objective recommendation. The workflow ranks passing voices by lowest WER, highest content-word recall, and Local KittenTTS catalog order as the final tie-breaker.\n\nValidated ASR voice-audition evidence:\n\n| Context | SHA | Workflow run | Result |\n| --- | --- | ---: | :---: |\n| PR #114 head | `037a0f0a61e13c76ddc0f9a16ef88adb2f38f141` | `34821757481` | PASS |\n| PR #114 post-merge master | `21fac6785f008b1d5ab7f46e9125c76ca4c087ad` | `34848251323` | PASS |\n\n`Luna`, `Bruno`, `Hugo`, and `Leo` tied with perfect WER and content recall in the PR-head evidence. `Luna` won by the documented catalog-order tie-breaker.\n\nPR #115 changed the shipped Local TTS default to `Luna` and synced the generated backend contract plus runtime test expectation. Exact PR-head validation passed on `4a8bf77e4803b7898c717a3cbe145f9df9600c75`:\n\n- CI `34853091162` — PASS.\n- KittenTTS production CPU acceptance `34853091150` — PASS.\n- KittenTTS ASR intelligibility smoke `34853091234` — PASS.\n- KittenTTS ASR voice audition `34853091230` — PASS.\n\nPR #115 was guarded-merged as `96ff21e17b02aa0e3b5d8d783bd09400297eaaa4`. Exact post-merge validation passed:\n\n- CI `34854193904` — PASS.\n- KittenTTS production CPU acceptance `34854193873` — PASS.\n- KittenTTS ASR intelligibility smoke `34854193869` — PASS.\n- KittenTTS ASR voice audition `34854193968` — PASS.\n\nThis closes `KCR-330` / `KTT-805` for V1 by owner-approved ASR proxy evidence. It does not claim subjective human listening, best Moose comedic fit, timbre preference, fatigue tolerance, or real-speaker character fit.\n\n"""
          if marker not in evidence_text:
              raise SystemExit("evidence: final decision marker not found")
          Path(evidence).write_text(evidence_text.replace(marker, insert + marker, 1), encoding="utf-8")
          replace_once(
              evidence,
              "`KCR-330` / `KTT-805` remains open and owner-only. The owner must audition the real Local Kitten voices and choose the default Local TTS voice; automated ASR and CI evidence cannot close that subjective voice-quality/default-selection gate.\n",
              "`KCR-330` / `KTT-805` is now closed for V1 by owner-approved ASR proxy evidence from PR #114 and PR #115. The selected V1 Local KittenTTS default is `Luna`. This does not claim subjective human listening; a future real-device subjective pass can still override `Luna` if the owner prefers another catalog voice.\n",
          )

          Path(".github/workflows/ralph-kittentts-luna-doc-reconcile.yml").unlink()
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ralph-bridge[bot]"
          git config user.email "326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com"
          git add docs/KITTENTTS_LEGACY_TODO_RECONCILIATION_2026-09-12.md \
                  docs/KITTENTTS_CLOSEOUT_REMEDIATION_TODO_2026-09-12.md \
                  docs/KITTENTTS_CLOSEOUT_EVIDENCE_2026-09-12.md \
                  .github/workflows/ralph-kittentts-luna-doc-reconcile.yml
          git commit -m "docs: reconcile KittenTTS Luna default closeout"
          git push origin HEAD:ralph/kittentts-luna-doc-reconcile
