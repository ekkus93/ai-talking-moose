name: Ralph one-shot Local TTS Luna autofix

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/ralph-local-tts-luna-autofix.yml"
  push:
    branches:
      - ralph/local-tts-default-luna

permissions:
  contents: write

concurrency:
  group: ralph-local-tts-luna-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Apply generated contract/test sync and self-remove
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.ref == 'ralph/local-tts-default-luna'
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ralph/local-tts-default-luna

      - name: Apply exact Luna default fallout fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path("src-tauri/src/ai/local_tts/runtime/engine.rs")
          engine_text = engine.read_text(encoding="utf-8")
          old_engine = '''resolve_voice_key(manifest, DEFAULT_LOCAL_TTS_VOICE).unwrap(),
                      "expr-voice-2-f"'''
          new_engine = '''resolve_voice_key(manifest, DEFAULT_LOCAL_TTS_VOICE).unwrap(),
                      "expr-voice-3-f"'''
          if engine_text.count(old_engine) != 1:
              raise SystemExit("expected exactly one old default embedding assertion")
          engine.write_text(engine_text.replace(old_engine, new_engine, 1), encoding="utf-8")

          contract = Path("src/generated/backendContract.json")
          contract_text = contract.read_text(encoding="utf-8")
          old_contract = '"local_tts_voice": "Bella"'
          new_contract = '"local_tts_voice": "Luna"'
          if contract_text.count(old_contract) != 2:
              raise SystemExit("expected exactly two generated contract Bella defaults")
          contract.write_text(contract_text.replace(old_contract, new_contract), encoding="utf-8")

          Path(".github/workflows/ralph-local-tts-luna-autofix.yml").unlink()
          PY

      - name: Commit and push autofix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "chatgpt-ralph-bridge[bot]"
          git config user.email "326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com"
          git add src-tauri/src/ai/local_tts/runtime/engine.rs src/generated/backendContract.json .github/workflows/ralph-local-tts-luna-autofix.yml
          git commit -m "fix: sync Luna default contract and tests"
          git push origin HEAD:ralph/local-tts-default-luna
