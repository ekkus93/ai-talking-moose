name: V1R-006 lockfile generation

on:
  push:
    branches:
      - ralph/v1r-006-dev-advisories-20260828

permissions:
  contents: write

jobs:
  resolve-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve package lock normally from a clean tree
        shell: bash
        run: |
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts

      - name: Verify resolved dependency tree
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --include=dev --audit-level=high

      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/v1r006_lock.yml
          git add package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: resolve V1R-006 package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
