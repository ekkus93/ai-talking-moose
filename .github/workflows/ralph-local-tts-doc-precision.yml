name: Ralph Local TTS doc precision cleanup

on:
  push:
    branches:
      - ralph/local-tts-doc-precision
    paths:
      - ".github/workflows/ralph-local-tts-doc-precision.yml"

permissions:
  contents: write

concurrency:
  group: ralph-local-tts-doc-precision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ralph/local-tts-doc-precision
          fetch-depth: 0

      - name: Apply documentation precision cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/LOCAL_TTS_POST_REVIEW_HARDENING_SPEC_2026-09-14.md'): [
                  (
                      '**Status:** Proposed finite remediation queue',
                      '**Status:** Implemented by PR #118; closeout reconciled by PR #119; documentation precision cleanup pending',
                  ),
              ],
              Path('docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md'): [
                  (
                      'Unit tests cover the predicate. Real KittenTTS CPU acceptance records `KITTENTTS_WAVEFORM_SHAPE` so the pinned production model supplies observed runtime-shape evidence.',
                      'Unit tests cover the predicate. Dedicated waveform-contract evidence run `34876293975` records `KITTENTTS_WAVEFORM_SHAPE` on Linux x86_64 and macOS arm64 so the pinned production model supplies observed runtime-shape evidence without changing the permanent production CPU workflow.',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ralph-local-tts-doc-precision.yml')
          workflow.unlink()
          PY

      - name: Verify cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md
          docs/LOCAL_TTS_POST_REVIEW_HARDENING_SPEC_2026-09-14.md"
          if [ "$changed" != "$expected" ]; then
            printf 'unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
          git diff --check
          grep -F '**Status:** Implemented by PR #118; closeout reconciled by PR #119; documentation precision cleanup pending' docs/LOCAL_TTS_POST_REVIEW_HARDENING_SPEC_2026-09-14.md
          grep -F 'Dedicated waveform-contract evidence run `34876293975` records `KITTENTTS_WAVEFORM_SHAPE`' docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git add docs/LOCAL_TTS_POST_REVIEW_HARDENING_SPEC_2026-09-14.md docs/LOCAL_TTS_POST_REVIEW_HARDENING_IMPLEMENTATION_EVIDENCE_2026-09-14.md .github/workflows/ralph-local-tts-doc-precision.yml
          git commit -m 'docs: tighten Local TTS post-review precision'
          git push origin HEAD:ralph/local-tts-doc-precision
