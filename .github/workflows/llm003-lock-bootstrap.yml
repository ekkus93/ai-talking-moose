name: LLM-003 lock bootstrap

on:
  push:
    branches:
      - ralph/local-llm-llm003-20260831

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out LLM-003 branch
        uses: actions/checkout@v7
        with:
          ref: ralph/local-llm-llm003-20260831

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve pinned dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

      - name: Commit Cargo.lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m "build: lock llama.cpp binding"
          git push origin HEAD:ralph/local-llm-llm003-20260831
