name: ASR-015 Native Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/**"
      - "src-tauri/build.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/native/**"
      - "src-tauri/tauri.conf.json"
      - "scripts/prepare_moonshine_macos.sh"
      - "scripts/validate_moonshine_runtime_manifest.py"
      - "scripts/prepare_asr015_corpus.py"
      - "scripts/run_asr015_macos_acceptance.sh"
      - "scripts/render_asr015_benchmark_report.py"
      - ".github/workflows/asr015-native-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: asr015-native-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  supported-mac-native-acceptance:
    name: Tiny + Small native acceptance and CPU benchmark
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: asr015-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            asr015-${{ runner.os }}-${{ runner.arch }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Validate pinned native runtime provenance
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      # Any macOS Cargo build reads the Tauri framework list from tauri.conf.json.
      # Stage the pinned dylibs before invoking Cargo so the build script can
      # validate and link the declared runtime deterministically.
      - name: Prepare pinned Moonshine native runtime
        run: bash scripts/prepare_moonshine_macos.sh arm64

      - name: Validate pinned model manifest Rust contract
        env:
          TALKING_MOOSE_MOONSHINE_LIB_DIR: ${{ github.workspace }}/src-tauri/native/macos
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/native/macos
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            asr::moonshine::manifest::tests::pinned_manifests_are_structurally_valid

      - name: Run Tiny and Small native acceptance benchmark
        id: benchmark
        run: |
          work_root="$RUNNER_TEMP/talking-moose-asr015"
          bash scripts/run_asr015_macos_acceptance.sh arm64 "$work_root"
          report="$work_root/ASR015_SUPPORTED_MAC_ACCEPTANCE.md"
          test -s "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
