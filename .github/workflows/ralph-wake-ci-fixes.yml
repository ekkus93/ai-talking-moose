name: Ralph Wake CI Fixes

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - ".github/workflows/ralph-wake-ci-fixes.yml"
      - "scripts/ralph_wake_source_fixes.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
      - name: Apply Wake Word source fixes
        run: python3 scripts/ralph_wake_source_fixes.py
      - name: Commit source fixes and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ralph-wake-ci-fixes.yml scripts/ralph_wake_source_fixes.py
          git config user.name "Ralph Wake Loop"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close Wake Word source CI failures"
          git push origin HEAD:ralph/wake-word-v1-core
