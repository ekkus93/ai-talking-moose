name: Ralph Wake CI Fixes

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - ".github/workflows/ralph-wake-ci-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
      - name: Apply exact-head CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def repl(path: str, old: str, new: str, *, all_matches: bool = False) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              text = text.replace(old, new) if all_matches else text.replace(old, new, 1)
              file.write_text(text, encoding="utf-8")

          repl(
              "src-tauri/src/bin/wake_word_acceptance.rs",
              "    Ok(data\n        .chunks_exact(2)\n        .map(|chunk| i16::from_le_bytes([chunk[0], chunk[1]]))\n        .collect())",
              "    Ok(data\n        .as_chunks::<2>()\n        .0\n        .iter()\n        .map(|chunk| i16::from_le_bytes(*chunk))\n        .collect())",
          )
          repl(
              "src-tauri/src/audio/wake_word/runtime.rs",
              "vec![1_u8, 0_u8].repeat(1600)",
              "[1_u8, 0_u8].repeat(1600)",
              all_matches=True,
          )
          repl(
              "src-tauri/src/commands/character.rs",
              "        let (pcm_tx, _pcm_rx) = tokio::sync::mpsc::channel(1);\n        capture.lock().start(None, 16_000, pcm_tx, None).unwrap();\n        playback.seed_buffer_for_tests(&[0.25, -0.25, 0.5], 0.5);",
              "        playback.seed_buffer_for_tests(&[0.25, -0.25, 0.5], 0.5);",
          )
          repl(
              "src-tauri/src/commands/character.rs",
              "        .expect(\"interaction setup state should succeed through IPC\");\n\n        InteractionTestFixture {",
              "        .expect(\"interaction setup state should succeed through IPC\");\n\n        // Build/setup may reconcile inactive wake capture. Arm the explicit mock\n        // microphone only after the presentation state is established so these\n        // tests exercise mute/dismiss teardown from an actually active capture.\n        let (pcm_tx, _pcm_rx) = tokio::sync::mpsc::channel(1);\n        capture.lock().start(None, 16_000, pcm_tx, None).unwrap();\n\n        InteractionTestFixture {",
          )
          repl(
              "scripts/check_local_tts_packaging_policy.py",
              "    resources = bundle.get(\"resources\", [])\n    if resources != [\"native/macos/notices/\"]:\n        fail(\"ordinary Tauri resources must remain notice-only; Local TTS artifacts are installer-owned\")",
              "    resources = bundle.get(\"resources\", [])\n    allowed_resources = {\"native/macos/notices/\", \"resources/wake_word/\"}\n    if len(resources) != len(allowed_resources) or set(resources) != allowed_resources:\n        fail(\n            \"ordinary Tauri resources may contain notices plus the independently pinned \"\n            \"Wake Word subtree; Local TTS artifacts remain installer-owned\"\n        )",
          )
          repl(
              ".github/workflows/wake-word-v1-acceptance.yml",
              "      - name: Build exact production KWS acceptance harness\n        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin wake_word_acceptance",
              "      - name: Generate application icon set\n        run: python3 scripts/generate_app_icons.py\n      - name: Build exact production KWS acceptance harness\n        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin wake_word_acceptance",
          )
          PY
          rm .github/workflows/ralph-wake-ci-fixes.yml
          git config user.name "Ralph Wake Loop"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          for expected in \
            .github/workflows/wake-word-v1-acceptance.yml \
            scripts/check_local_tts_packaging_policy.py \
            src-tauri/src/audio/wake_word/runtime.rs \
            src-tauri/src/bin/wake_word_acceptance.rs \
            src-tauri/src/commands/character.rs \
            .github/workflows/ralph-wake-ci-fixes.yml; do
            printf '%s\n' "$changed" | grep -Fx "$expected" >/dev/null
          done
          test "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = 6
          git commit -m "fix: close Wake Word exact-head CI failures"
          git push origin HEAD:ralph/wake-word-v1-core
