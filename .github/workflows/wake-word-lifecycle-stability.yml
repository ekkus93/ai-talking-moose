name: Wake Word lifecycle stability

on:
  push:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/wake_word_runtime.rs"
      - "src-tauri/src/asr/wake_word_stability.rs"
      - "src-tauri/src/app/wake_word_composition.rs"
      - "src-tauri/src/app/wake_word_lifecycle_stability_tests.rs"
      - "src-tauri/src/app/wake_word_state.rs"
      - "src-tauri/src/app/runtime_preferences.rs"
      - "src-tauri/src/commands/wake_word.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/wake-word-lifecycle-stability.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src-tauri/src/asr/wake_word_runtime.rs"
      - "src-tauri/src/asr/wake_word_stability.rs"
      - "src-tauri/src/app/wake_word_composition.rs"
      - "src-tauri/src/app/wake_word_lifecycle_stability_tests.rs"
      - "src-tauri/src/app/wake_word_state.rs"
      - "src-tauri/src/app/runtime_preferences.rs"
      - "src-tauri/src/commands/wake_word.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/wake-word-lifecycle-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-word-lifecycle-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TALKING_MOOSE_ALLOW_LIVE_API: "0"

jobs:
  lifecycle-stability:
    name: Wake Word lifecycle stability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          bash scripts/prepare_ubuntu_apt.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libasound2-dev \
            libayatana-appindicator3-dev libclang-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wake-lifecycle-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wake-lifecycle-
            ${{ runner.os }}-cargo-
      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py
      - name: Run Wake Word runtime stability tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features wake_word_stability -- --nocapture
      - name: Run Wake Word application lifecycle stability tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features wake_word_lifecycle_stability -- --nocapture
