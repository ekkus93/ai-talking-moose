name: P5 runtime refactor one-shot

on:
  push:
    branches:
      - ralph/local-llm-p5-runtime-20260831

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/local-llm-p5-runtime-20260831
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Finalize module split and telemetry semantics
        shell: python
        run: |
          from pathlib import Path

          manager = Path("src-tauri/src/ai/local/runtime/manager.rs")
          text = manager.read_text()
          old = "    fn validate_request(\n"
          if text.count(old) != 1:
              raise SystemExit(f"manager.rs: validate_request matches={text.count(old)}")
          text = text.replace(old, "    pub(super) fn validate_request(\n", 1)

          old = "        self.finish_operation(&result);\n"
          if text.count(old) != 1:
              raise SystemExit(f"manager.rs: generation finish matches={text.count(old)}")
          text = text.replace(old, "        self.finish_generation(&result);\n", 1)

          synthetic_start = text.index(
              "        self.finish_operation(&result.as_ref().map(|_| LocalRuntimeGeneration {"
          )
          synthetic_end = text.index(
              "        result\n    }\n\n    pub(crate) fn diagnostics", synthetic_start
          )
          text = text[:synthetic_start] + "        self.sync_loaded_state();\n" + text[synthetic_end:]

          old = "        self.inner.telemetry.write().loaded = None;\n"
          if text.count(old) != 1:
              raise SystemExit(f"manager.rs: shutdown loaded reset matches={text.count(old)}")
          text = text.replace(old, "        self.sync_loaded_state();\n", 1)

          finish_start = text.index("    fn finish_operation(")
          finish_end = text.index("\n    #[cfg(test)]\n    pub(super) fn phase", finish_start)
          replacement = '''    fn finish_generation(
              &self,
              result: &Result<LocalRuntimeGeneration, LocalRuntimeError>,
          ) {
              let loaded = self.inner.state.lock().loaded.clone();
              let mut telemetry = self.inner.telemetry.write();
              telemetry.generation_in_progress = false;
              telemetry.loaded = loaded;
              match result {
                  Ok(generation) => {
                      telemetry.last_error_category = None;
                      telemetry.last_generation_duration_ms = Some(generation.duration_ms);
                      telemetry.last_prompt_tokens = Some(generation.prompt_tokens);
                      telemetry.last_output_tokens = Some(generation.output_tokens);
                      telemetry.last_tokens_per_second = generation.tokens_per_second;
                  }
                  Err(error) => telemetry.last_error_category = Some(error.kind),
              }
          }

          fn sync_loaded_state(&self) {
              let loaded = self.inner.state.lock().loaded.clone();
              self.inner.telemetry.write().loaded = loaded;
          }
          '''
          manager.write_text(text[:finish_start] + replacement + text[finish_end:])

          llama = Path("src-tauri/src/ai/local/runtime/llama.rs")
          text = llama.read_text()
          old_import = '''use super::{
              LocalRuntimeError, LocalRuntimeGenerateRequest, LocalRuntimeGeneration, RuntimeEngine,
              RuntimeModelSpec,
          };
          '''
          if text.count(old_import) != 1:
              raise SystemExit(f"llama.rs: legacy import matches={text.count(old_import)}")
          text = text.replace(
              old_import,
              '''use super::manager::RuntimeEngine;
          use super::types::{
              LocalRuntimeError, LocalRuntimeGenerateRequest, LocalRuntimeGeneration, RuntimeModelSpec,
          };
          ''',
              1,
          )
          old = "use llama_cpp_2::model::{AddBos, LlamaModel};\n"
          if text.count(old) != 1:
              raise SystemExit(f"llama.rs: model import matches={text.count(old)}")
          text = text.replace(
              old,
              old + "use llama_cpp_2::token::LlamaToken;\nuse llama_cpp_2::TokenToStringError;\n",
              1,
          )

          generate_start = text.index("    fn generate(\n")
          helper = '''    fn token_piece_bytes(
              model: &LlamaModel,
              token: LlamaToken,
          ) -> Result<Vec<u8>, LocalRuntimeError> {
              match model.token_to_piece_bytes(token, 16, true, None) {
                  Ok(bytes) => Ok(bytes),
                  Err(TokenToStringError::InsufficientBufferSpace(required)) if required < 0 => {
                      let required = required
                          .checked_neg()
                          .and_then(|value| usize::try_from(value).ok())
                          .ok_or_else(LocalRuntimeError::output_decode)?;
                      model
                          .token_to_piece_bytes(token, required, true, None)
                          .map_err(|_| LocalRuntimeError::output_decode())
                  }
                  Err(_) => Err(LocalRuntimeError::output_decode()),
              }
          }

          '''
          text = text[:generate_start] + helper + text[generate_start:]

          old = "        let mut decoder = encoding_rs::UTF_8.new_decoder();\n        let mut output = String::new();\n"
          if text.count(old) != 1:
              raise SystemExit(f"llama.rs: decoder block matches={text.count(old)}")
          text = text.replace(old, "        let mut output_bytes = Vec::new();\n", 1)

          piece_start = text.index("            let piece = model\n")
          piece_end = text.index("            output_tokens += 1;\n", piece_start)
          text = (
              text[:piece_start]
              + "            output_bytes.extend_from_slice(&Self::token_piece_bytes(model, token)?);\n"
              + text[piece_end:]
          )

          old = "        let _ = decoder.decode_to_string(b\"\", &mut output, true);\n        let duration = started.elapsed();\n"
          if text.count(old) != 1:
              raise SystemExit(f"llama.rs: decoder flush matches={text.count(old)}")
          text = text.replace(
              old,
              "        let output = String::from_utf8(output_bytes)\n            .map_err(|_| LocalRuntimeError::output_decode())?;\n        let duration = started.elapsed();\n",
              1,
          )
          llama.write_text(text)

          Path("src-tauri/src/ai/local/runtime/mod.rs").write_text('''//! Isolated local llama.cpp runtime.
          //!
          //! Binding-specific model/context/sampler types are confined below this module boundary.
          //! Application state and commands interact only with the neutral runtime manager/types.

          mod llama;
          mod manager;
          #[cfg(test)]
          mod tests;
          mod types;

          pub(crate) use manager::LocalRuntimeManager;
          ''')
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p5-runtime-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/ai/local/runtime
          git diff --cached --check
          git diff --cached --quiet && { echo "No refactor changes produced" >&2; exit 1; }
          git commit -m "refactor: split and harden local LLM runtime"
          git push origin HEAD:ralph/local-llm-p5-runtime-20260831
