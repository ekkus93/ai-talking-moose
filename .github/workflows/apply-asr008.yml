name: Apply ASR-008 patch

on:
  push:
    branches:
      - asr-008-small

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact ASR-008 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/asr008.patch.gz.b64 | gzip --decompress --stdout > /tmp/asr008.patch
          git apply --index /tmp/asr008.patch
          git rm .github/asr008.patch.gz.b64 .github/workflows/apply-asr008.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "asr: integrate Moonshine Small streaming"
          git push origin HEAD:asr-008-small
