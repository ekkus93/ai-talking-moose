name: Wake Word source security audit

on:
  pull_request:
    branches: [master]
    paths:
      - "src-tauri/src/app/wake_word*.rs"
      - "src-tauri/src/asr/wake_word*.rs"
      - "src-tauri/src/app/state.rs"
      - "src-tauri/src/conversation/session.rs"
      - "src-tauri/src/conversation/session/**"
      - "src-tauri/src/commands/conversation/**"
      - "scripts/check_wake_word_source_security_audit.mjs"
      - ".github/workflows/wake-word-source-security-audit.yml"
  push:
    branches: [master]
    paths:
      - "src-tauri/src/app/wake_word*.rs"
      - "src-tauri/src/asr/wake_word*.rs"
      - "src-tauri/src/app/state.rs"
      - "src-tauri/src/conversation/session.rs"
      - "src-tauri/src/conversation/session/**"
      - "src-tauri/src/commands/conversation/**"
      - "scripts/check_wake_word_source_security_audit.mjs"
      - ".github/workflows/wake-word-source-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-word-source-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Wake Word source security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit Wake Word source invariants
        run: node scripts/check_wake_word_source_security_audit.mjs
