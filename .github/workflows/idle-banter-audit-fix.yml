                      )
                      .unwrap();
                  assert_eq!(first.seed_topic, "one");

                  let interaction = start + Duration::from_secs(301);
                  runtime.reset_at(&settings, interaction);
                  let second = runtime
                      .poll_due_at_with_samples(
                          &settings,
                          interaction + Duration::from_secs(300),
