name: Idle Banter audit hardening

on:
  push:
    branches:
      - ralph/idle-banter-implementation
    paths:
      - .github/workflows/idle-banter-audit-fix.yml

permissions:
  contents: write

jobs:
  apply-audit-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/idle-banter-implementation
          fetch-depth: 0

      - name: Apply audited Idle Banter fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch context missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Preserve the previous seed across inactivity-episode resets and choose
          # uniformly from the remaining topics. Production uses independent random
          # samples for topic choice and repeat jitter while deterministic tests retain
          # the single-sample helper.
          path = "src-tauri/src/character/idle_banter.rs"
          replace_once(
              path,
              '''fn normalize_line_fingerprint(line: &str) -> String {
              line.split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
                  .trim()
                  .to_lowercase()
          }

          #[derive(Debug, Clone, PartialEq, Eq)]''',
              '''fn normalize_line_fingerprint(line: &str) -> String {
              line.split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
                  .trim()
                  .to_lowercase()
          }

          fn seed_index_avoiding_previous(
              topics: &[String],
              previous: Option<&str>,
              unit_sample: f64,
          ) -> usize {
              debug_assert!(!topics.is_empty());
              let previous_key = previous.map(str::to_lowercase);
              let previous_index = previous_key.as_ref().and_then(|key| {
                  topics
                      .iter()
                      .position(|topic| topic.to_lowercase() == *key)
              });
              let excluded = usize::from(previous_index.is_some() && topics.len() > 1);
              let choice_count = topics.len() - excluded;
              let choice = ((unit_sample.clamp(0.0, 0.999_999) * choice_count as f64) as usize)
                  .min(choice_count - 1);

              match previous_index {
                  Some(previous_index) if topics.len() > 1 && choice >= previous_index => choice + 1,
                  _ => choice,
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq)]''',
          )
          replace_once(
              path,
              '''        self.enabled = settings.idle_banter_enabled;
                  self.episode_started = now;
                  self.next_due = now + minutes(settings.idle_banter_initial_delay_minutes);
                  self.last_seed = None;
              }''',
              '''        self.enabled = settings.idle_banter_enabled;
                  self.episode_started = now;
                  self.next_due = now + minutes(settings.idle_banter_initial_delay_minutes);
              }''',
          )
          replace_once(
              path,
              '''    pub fn poll_due(&mut self, settings: &AppSettings) -> Option<IdleBanterDue> {
                  self.poll_due_at(
                      settings,
                      Instant::now(),
                      rand::thread_rng().gen_range(0.0..=1.0),
                  )
              }

              fn poll_due_at(
                  &mut self,
                  settings: &AppSettings,
                  now: Instant,
                  unit_sample: f64,
              ) -> Option<IdleBanterDue> {
          ''',
