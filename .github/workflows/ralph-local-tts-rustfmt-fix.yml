name: Ralph one-shot Local TTS rustfmt fix

on:
  push:
    branches:
      - ralph/local-tts-post-review-hardening
    paths:
      - .github/workflows/ralph-local-tts-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  rustfmt-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ralph/local-tts-post-review-hardening
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/ralph-local-tts-rustfmt-fix.yml
          git diff --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: apply Rust formatting'
          git push origin HEAD:ralph/local-tts-post-review-hardening
