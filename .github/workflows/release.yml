name: macOS Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Tagged source release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TALKING_MOOSE_ALLOW_LIVE_API: "0"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-source-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate tag and release metadata
        run: python3 scripts/validate_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Validate Moonshine runtime provenance
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Validate release helper syntax
        run: |
          python3 -m py_compile \
            scripts/generate_app_icons.py \
            scripts/validate_release_metadata.py \
            scripts/collect_release_licenses.py
          bash -n scripts/prepare_moonshine_macos.sh
          bash -n scripts/verify_macos_bundle.sh
          bash -n scripts/verify_app_build_provenance.sh
          bash -n scripts/verify_macos_release.sh
          bash -n scripts/run_p2_p3_macos_physical_acceptance.sh
          bash -n scripts/run_p13_macos_release_acceptance.sh

      - name: Run frontend release gate
        run: npm run check:frontend

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Collect dependency license texts
        run: python3 scripts/collect_release_licenses.py

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  build-macos:
    name: Signed macOS release (${{ matrix.arch }})
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            deployment_target: "13.4"
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: "13.4"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TALKING_MOOSE_ALLOW_LIVE_API: "0"
      TALKING_MOOSE_BUILD_COMMIT: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate tag and release metadata
        run: python3 scripts/validate_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Require Developer ID and notarization credentials
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Validate Moonshine runtime provenance
        run: python3 scripts/validate_moonshine_runtime_manifest.py

      - name: Build pinned Moonshine native runtime
        run: bash scripts/prepare_moonshine_macos.sh "${{ matrix.arch }}"

      - name: Collect dependency license texts
        run: python3 scripts/collect_release_licenses.py

      - name: Build, sign, notarize, and staple application and DMG
        run: npm run tauri build -- --bundles app,dmg

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app_path" && test -d "$app_path"
          test -n "$dmg_path" && test -f "$dmg_path"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Verify signed and notarized release
        run: |
          bash scripts/verify_macos_release.sh \
            "${{ steps.artifacts.outputs.app_path }}" \
            "${{ steps.artifacts.outputs.dmg_path }}" \
            "${{ matrix.arch }}" \
            "$GITHUB_SHA"

      - name: Stage architecture release files
        shell: bash
        run: |
          mkdir -p release
          base="Talking-Moose-AI_${GITHUB_REF_NAME}_macos_${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.artifacts.outputs.app_path }}" \
            "release/${base}.app.zip"
          cp "${{ steps.artifacts.outputs.dmg_path }}" "release/${base}.dmg"
          (
            cd release
            shasum -a 256 "${base}.app.zip" "${base}.dmg" > "${base}.SHA256SUMS.txt"
          )

      - name: Upload signed tagged release files
        uses: actions/upload-artifact@v4
        with:
          name: talking-moose-ai-${{ github.ref_name }}-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Create draft GitHub release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Generate release icon set
        run: python3 scripts/generate_app_icons.py

      - name: Validate tag and release metadata
        run: python3 scripts/validate_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Download signed release files
        uses: actions/download-artifact@v5
        with:
          pattern: talking-moose-ai-${{ github.ref_name }}-macos-*
          path: release
          merge-multiple: true

      - name: Verify architecture artifact set and checksums
        shell: bash
        run: |
          cd release
          test "$(find . -maxdepth 1 -type f -name '*.app.zip' | wc -l | tr -d ' ')" = 2
          test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = 2
          test "$(find . -maxdepth 1 -type f -name '*_macos_*.SHA256SUMS.txt' | wc -l | tr -d ' ')" = 2
          for manifest in *_macos_*.SHA256SUMS.txt; do
            sha256sum -c "$manifest"
          done

      - name: Build combined checksum manifest
        run: |
          cd release
          sha256sum *.app.zip *.dmg | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release for physical acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "Talking Moose AI ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            release/*.app.zip \
            release/*.dmg \
            release/*_macos_*.SHA256SUMS.txt \
            release/SHA256SUMS.txt
