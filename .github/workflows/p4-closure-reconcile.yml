              idx = text.rfind("\n}")
              if idx < 0:
                  raise SystemExit("conversation.rs test module close not found")
              text = text[:idx] + insert + text[idx:]
          p.write_text(text)

          # V1R-043: exercise interruption through the real conversation event loop.
          p = Path("src-tauri/src/conversation/session/tests.rs")
          text = p.read_text()
          if "interrupted_event_clears_partial_moose_transcript_and_speech_bubble" not in text:
              text += r'''

#[tokio::test]
async fn interrupted_event_clears_partial_moose_transcript_and_speech_bubble() {
    let manager = ConversationManager::new();
    let generation = 61;
    let session_id = "interrupted-transcript-session";
    manager.generation.store(generation, Ordering::SeqCst);
    manager.is_in_conversation.store(true, Ordering::SeqCst);
    *manager.active_session_id.lock() = Some(session_id.to_string());
    *manager.lifecycle.write() = ConversationLifecycle::Listening;

    let capture = Arc::new(SyncMutex::new(AudioCapture::new_mock()));
    let playback = Arc::new(AudioPlayback::new());
    let transcript_events = Arc::new(SyncMutex::new(Vec::<(String, String)>::new()));
    let transcript_events_for_callback = transcript_events.clone();
    let bubble_events = Arc::new(SyncMutex::new(Vec::<String>::new()));
    let bubble_events_for_callback = bubble_events.clone();
    let lifecycle_callback: LifecycleCallback = Arc::new(|_| {});
    let context = ConversationEventLoopContext {
        generation,
        session_id: session_id.to_string(),
        capture,
        playback,
        output_sample_rate: 24_000,
        tool_router: test_tool_router(),
        state_callback: Arc::new(|_| {}),
        lifecycle_callback,
        provider_error_callback: Arc::new(|_| {}),
        transcript_callback: Arc::new(move |_session_id, role, text| {
            transcript_events_for_callback.lock().push((role, text));
        }),
        speech_bubble_callback: Arc::new(move |text| {
            bubble_events_for_callback.lock().push(text);
        }),
    };
    let (event_tx, event_rx) = mpsc::channel(4);
    event_tx
        .send(LiveServerEvent::ModelTranscript(TranscriptUpdate {
            text: "partial moose".to_string(),
            is_final: false,
        }))
        .await
        .unwrap();
    event_tx.send(LiveServerEvent::Interrupted).await.unwrap();
    event_tx.send(LiveServerEvent::Closed).await.unwrap();
    drop(event_tx);

    manager.run_event_loop(event_rx, context).await;

    let transcript_events = transcript_events.lock().clone();
    assert!(transcript_events
        .iter()
        .any(|(role, text)| role == "moose_partial" && text == "partial moose"));
    assert!(transcript_events
        .iter()
        .any(|(role, text)| role == "moose_partial" && text.is_empty()));
    assert_eq!(
        bubble_events.lock().clone(),
        vec!["partial moose".to_string(), String::new()]
    );
}
'''
              p.write_text(text)

          # Reconcile the stale P4 tracker only after the audited implementation/test patch above.
