name: Ralph Wake Core Normalize

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-core-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust and regenerate Cargo lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/ralph-wake-core-normalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock src-tauri/src/audio/wake_word .github/workflows/ralph-wake-core-normalize.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: format wake runtime and refresh lockfile"
          git push origin HEAD:ralph/wake-word-v1-core
