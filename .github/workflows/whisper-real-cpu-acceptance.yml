name: Whisper Real CPU Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-real-cpu-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  TALKING_MOOSE_ALLOW_LIVE_API: "0"

jobs:
  real-cpu-acceptance:
    name: Real whisper-small CPU acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Verify acceptance source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Whisper ASR acceptance checkout: $actual"
          test "$actual" = "$GITHUB_SHA"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            util-linux

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: whisper-acceptance-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            whisper-acceptance-${{ runner.os }}-
            ${{ runner.os }}-cargo-

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Build opt-in acceptance binary
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --features whisper-acceptance \
            --bin whisper_acceptance

      - name: Install, isolate, and transcribe
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/debug/whisper_acceptance"
          work_root="$RUNNER_TEMP/talking-moose-whisper-acceptance"
          model_root="$work_root/models"
          report_root="$work_root/reports"
          corpus_wav="$GITHUB_WORKSPACE/third_party/whisper.cpp/samples/jfk.wav"
          mkdir -p "$model_root" "$report_root"
          test -f "$corpus_wav"

          cpu_name="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          test -n "$cpu_name"

          echo "Installing the verified whisper-small model through the production installer"
          "$binary" install "$model_root" "$report_root/whisper-small-install.json"

          echo "Transcribing $corpus_wav inside an OS network namespace with no default route"
          sudo unshare --net -- env \
            "GITHUB_SHA=$GITHUB_SHA" \
            "TALKING_MOOSE_ACCEPTANCE_HOST_CPU=$cpu_name" \
            "$binary" transcribe \
              "$model_root" \
              "$corpus_wav" \
              "$report_root/whisper-small-transcribe.json" \
              --require-network-denied

          sudo chown -R "$(id -u):$(id -g)" "$work_root"
          echo "report_root=$report_root" >> "$GITHUB_OUTPUT"
          echo "corpus_wav=$corpus_wav" >> "$GITHUB_OUTPUT"

      - name: Validate machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          report_root="${{ steps.acceptance.outputs.report_root }}"
          python3 - "$report_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          install_report = root / "whisper-small-install.json"
          transcribe_report = root / "whisper-small-transcribe.json"
          for p in (install_report, transcribe_report):
              assert p.exists(), f"missing report: {p}"

          install = json.loads(install_report.read_text(encoding="utf-8"))
          transcribe = json.loads(transcribe_report.read_text(encoding="utf-8"))

           print("## Whisper real CPU acceptance", file=open("/dev/stdout", "w"))
           summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
           with summary.open("a", encoding="utf-8") as out:
               out.write("## Whisper real CPU acceptance\n\n")
               out.write(
                   "| Model | Revision | SHA256 | Bytes | Duration (ms) | "
                   "No-speech | Segments | Text | Network denied |\n"
               )
               out.write("| --- | --- | ---: | ---: | ---: | ---: | ---: | --- | --- |\n")
               out.write(
                   f"| whisper-small | {install['revision']} | "
                   f"{install['sha256'][:16]}... | {install['installed_bytes']} | "
                   f"{transcribe['transcript']['duration_ms']} | "
                   f"{transcribe['transcript']['no_speech_prob']:.3f} | "
                   f"{transcribe['transcript']['num_segments']} | "
                   f"{transcribe['transcript']['text']} | yes |\n"
               )

               out.write("\n## Process resources\n\n")
               out.write(
                   "| Phase wall (ms) | CPU time (ms) | CPU usage (%) | "
                   "RSS (bytes) | Peak RSS (bytes) |\n"
               )
               out.write("| ---: | ---: | ---: | ---: | ---: |\n")
               resource_usage = transcribe.get("process_cpu_usage_percent")
               if resource_usage is None:
                   resource_usage_text = "n/a"
               else:
                   resource_usage_text = f"{resource_usage:.2f}"
               out.write(
                   f"| {transcribe.get('phase_wall_ms')} | "
                   f"{transcribe.get('process_cpu_time_ms')} | {resource_usage_text} | "
                   f"{transcribe.get('resident_memory_bytes')} | "
                   f"{transcribe.get('peak_resident_memory_bytes')} |\n"
               )

           assert install["schema_version"] == 1
           assert transcribe["schema_version"] == 1
           assert (
               install["model_id"] == transcribe["model_id"] == "whisper-small-ggml"
           )
           assert install["revision"] == transcribe["revision"]
           assert install["sha256"] == transcribe["sha256"]
           assert install["expected_bytes"] == transcribe["expected_bytes"]
           assert install["production_installer_verified"] is True
           assert install["disposition"] in ("installed", "already-installed")
           assert install["installed_bytes"] == install["expected_bytes"]
           assert transcribe["runtime"]["whisper_native_linked"] is True
           assert transcribe["network_denial_probe_passed"] is True
           assert transcribe["transcript"]["transcription_ok"] is True
           assert transcribe["transcript"]["no_speech_prob"] >= 0.0
           assert transcribe["transcript"]["no_speech_prob"] <= 1.0
           assert transcribe["transcript"]["num_segments"] >= 0
           assert transcribe["transcript"]["text"].strip()
           assert transcribe["phase_wall_ms"] > 0
           assert transcribe["phase_wall_ms"] >= transcribe["transcribe_wall_ms"]
           assert transcribe["process_cpu_time_ms"] > 0
           assert transcribe["process_cpu_usage_percent"] is not None
           resource_usage = float(transcribe["process_cpu_usage_percent"])
           assert 0.0 <= resource_usage < float("inf")
           assert transcribe["baseline_resident_memory_bytes"] > 0
           assert transcribe["resident_memory_bytes"] > 0
           assert transcribe["peak_resident_memory_bytes"] >= transcribe["resident_memory_bytes"]
           assert transcribe["status"] == "pass"
          PY

      - name: Upload real-model acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-real-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/talking-moose-whisper-acceptance/reports/*.json
          if-no-files-found: warn
          retention-days: 30
