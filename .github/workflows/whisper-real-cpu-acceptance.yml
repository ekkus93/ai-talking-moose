name: Whisper Real CPU Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-real-cpu-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  TALKING_MOOSE_ALLOW_LIVE_API: "0"

jobs:
  real-cpu-acceptance:
    name: Real whisper-small CPU acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Verify acceptance source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Whisper ASR acceptance checkout: $actual"
          test "$actual" = "$GITHUB_SHA"
          python3 scripts/check_whisper_provenance.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
           build-essential \
           clang \
           cmake \
           libasound2-dev \
           libayatana-appindicator3-dev \
           libclang-dev \
           librsvg2-dev \
           libssl-dev \
           libwebkit2gtk-4.1-dev \
           libxdo-dev \
           util-linux

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
           ~/.cargo/registry
           ~/.cargo/git
          key: whisper-acceptance-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
           whisper-acceptance-${{ runner.os }}-
           ${{ runner.os }}-cargo-

      - name: Generate application icon set
        run: python3 scripts/generate_app_icons.py

      - name: Build opt-in acceptance binary
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
           --features whisper-acceptance \
           --bin whisper_acceptance

      - name: Install, isolate, and transcribe
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/debug/whisper_acceptance"
          work_root="$RUNNER_TEMP/talking-moose-whisper-acceptance"
          model_root="$work_root/models/whisper/whisper-small"
          report_root="$work_root/reports"
          corpus_wav="$GITHUB_WORKSPACE/third_party/whisper.cpp/samples/jfk.wav"
          mkdir -p "$report_root"
          test ! -e "$model_root"
          test -f "$corpus_wav"

          cpu_name="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          test -n "$cpu_name"

          echo "Installing the verified whisper-small model through the production installer"
          "$binary" install "$model_root" "$report_root/whisper-small-install-initial.json" \
            2>&1 | tee "$report_root/install.log"

          echo "Deleting the installed model through the production installer"
          "$binary" delete "$model_root" "$report_root/whisper-small-delete.json" \
            2>&1 | tee "$report_root/delete.log"
          test ! -e "$model_root/ggml-small.bin"
          test ! -e "$model_root/.talking-moose-model.json"

          echo "Reinstalling into the same clean-profile model root"
          "$binary" install "$model_root" "$report_root/whisper-small-install.json" \
            2>&1 | tee "$report_root/reinstall.log"

          echo "Transcribing $corpus_wav inside an OS network namespace with no default route"
          sudo unshare --net -- env \
           "GITHUB_SHA=$GITHUB_SHA" \
           "TALKING_MOOSE_ACCEPTANCE_HOST_CPU=$cpu_name" \
           "$binary" transcribe \
             "$model_root" \
             "$corpus_wav" \
             "$report_root/whisper-small-transcribe.json" \
             --require-network-denied 2>&1 | tee "$report_root/transcribe.log"

          sudo chown -R "$(id -u):$(id -g)" "$work_root"
          echo "report_root=$report_root" >> "$GITHUB_OUTPUT"
          echo "corpus_wav=$corpus_wav" >> "$GITHUB_OUTPUT"

      - name: Validate machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          report_root="${{ steps.acceptance.outputs.report_root }}"
          python3 - "$report_root" "${{ steps.acceptance.outputs.corpus_wav }}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          corpus_wav = pathlib.Path(sys.argv[2])
          install_report = root / "whisper-small-install.json"
          initial_install_report = root / "whisper-small-install-initial.json"
          delete_report = root / "whisper-small-delete.json"
          transcribe_report = root / "whisper-small-transcribe.json"
          for report_path in (
              initial_install_report,
              delete_report,
              install_report,
              transcribe_report,
          ):
              assert report_path.exists(), f"missing report: {report_path}"

          install = json.loads(install_report.read_text(encoding="utf-8"))
          initial_install = json.loads(
              initial_install_report.read_text(encoding="utf-8")
          )
          deletion = json.loads(delete_report.read_text(encoding="utf-8"))
          transcribe = json.loads(transcribe_report.read_text(encoding="utf-8"))
          manifest = pathlib.Path("src-tauri/src/asr/whisper/manifest.rs").read_text(
              encoding="utf-8"
          )

          def manifest_value(name):
              match = re.search(
                  rf'pub const {name}: &str =\s*"([^"]+)";', manifest
              )
              assert match, f"canonical manifest is missing {name}"
              return match.group(1)

          def manifest_bytes():
              match = re.search(
                  r"pub const WHISPER_MODEL_BYTES: u64 = ([\d_]+);", manifest
              )
              assert match, "canonical manifest is missing WHISPER_MODEL_BYTES"
              return int(match.group(1).replace("_", ""))
          model_path = (
              root.parent / "models" / "whisper" / "whisper-small" / "ggml-small.bin"
          )
          assert model_path.is_file(), f"missing installed model: {model_path}"
          model_bytes = model_path.stat().st_size
          with model_path.open("rb") as model_file:
              model_sha256 = hashlib.file_digest(model_file, "sha256").hexdigest()
          gitlink_line = subprocess.check_output(
              ["git", "ls-tree", "HEAD", "--", "third_party/whisper.cpp"],
              text=True,
          ).strip()
          gitlink_fields = gitlink_line.split()
          assert gitlink_fields[:2] == ["160000", "commit"], gitlink_line
          whisper_source_actual = gitlink_fields[2]
          whisper_source_expected = manifest_value("WHISPER_SOURCE_COMMIT")
          model_sha256_expected = manifest_value("WHISPER_MODEL_SHA256")
          model_bytes_expected = manifest_bytes()
          assert whisper_source_actual == whisper_source_expected, (
              f"native source mismatch: expected {whisper_source_expected}, "
              f"found {whisper_source_actual}"
          )
          repository_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          corpus_sha256 = hashlib.sha256(corpus_wav.read_bytes()).hexdigest()

          assert install["schema_version"] == 2
          assert transcribe["schema_version"] == 2
          assert install["git_sha"] == transcribe["git_sha"] == repository_sha
          assert install["model_id"] == transcribe["model_id"] == "whisper-small-ggml"
          assert install["revision"] == transcribe["revision"]
          assert install["source_commit"] == transcribe["source_commit"] == whisper_source_actual
          assert install["revision"] != install["source_commit"], (
              "model revision and native source revision must be recorded separately"
          )
          assert install["sha256"] == transcribe["sha256"]
          assert install["expected_bytes"] == transcribe["expected_bytes"]
          assert install["sha256"] == model_sha256_expected
          assert install["expected_bytes"] == model_bytes_expected
          assert model_sha256 == install["sha256"]
          assert model_bytes == install["installed_bytes"] == install["expected_bytes"]
          assert install["production_installer_verified"] is True
          assert initial_install["disposition"] == "installed"
          assert initial_install["production_installer_verified"] is True
          assert deletion["schema_version"] == 1
          assert deletion["phase"] == "delete"
          assert deletion["removed"] is True
          assert install["disposition"] == "installed"
          assert install["installed_bytes"] == install["expected_bytes"]
          assert transcribe["runtime"]["whisper_native_linked"] is True
          assert transcribe["network_denial_probe_passed"] is True
          assert transcribe["transcript"]["transcription_ok"] is True
          assert 0.0 <= transcribe["transcript"]["no_speech_prob"] <= 1.0
          assert transcribe["transcript"]["num_segments"] >= 0
          assert transcribe["transcript"]["text"].strip()
          assert transcribe["phase_wall_ms"] > 0
          assert transcribe["phase_wall_ms"] >= transcribe["transcribe_wall_ms"]
          assert transcribe["process_cpu_time_ms"] > 0
          assert transcribe["process_cpu_usage_percent"] is not None
          resource_usage = float(transcribe["process_cpu_usage_percent"])
          assert 0.0 <= resource_usage < float("inf")
          assert transcribe["baseline_resident_memory_bytes"] > 0
          assert transcribe["resident_memory_bytes"] > 0
          assert transcribe["peak_resident_memory_bytes"] >= transcribe["resident_memory_bytes"]
          pipeline = transcribe["pipeline"]
          assert pipeline["partial_interval_samples"] == 80000
          assert pipeline["endpoint_silence_samples"] == 8000
          assert pipeline["maximum_utterance_samples"] == 480000
          assert pipeline["queue_capacity_chunks"] == 56
          assert pipeline["partial_event_count"] >= 2
          assert pipeline["final_event_count"] == 1
          assert pipeline["first_partial_latency_ms"] is not None
          assert pipeline["first_final_latency_ms"] is not None
          assert pipeline["first_final_latency_ms"] >= pipeline["first_partial_latency_ms"]
          assert pipeline["processed_audio_ms"] > 0
          assert pipeline["inference_wall_time_ms"] > 0
          assert pipeline["real_time_factor"] is not None
          assert float(pipeline["real_time_factor"]) > 0.0
          assert pipeline["process_cpu_time_ms"] is not None
          assert pipeline["average_cpu_utilization_percent"] is not None
          assert pipeline["peak_resident_memory_bytes"] is not None
          assert pipeline["overload_attempted_chunks"] == 64
          assert pipeline["nominal_dropped_chunks"] == 0, (
              "normal-cadence Whisper input must not lose chunks"
          )
          assert (
              pipeline["overload_accepted_chunks"] + pipeline["overload_dropped_chunks"]
              == pipeline["overload_attempted_chunks"]
          )
          assert pipeline["overload_dropped_chunks"] > 0
          assert transcribe["status"] == "pass"

          evidence = {
              "schema_version": 1,
              "repository_sha": repository_sha,
              "workflow_identity": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"],
                  "run_url": (
                      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  ),
                  "artifact_name": (
                      f"whisper-real-cpu-{os.environ['GITHUB_RUN_ID']}-"
                      f"{os.environ['GITHUB_RUN_ATTEMPT']}-{repository_sha}"
                  ),
              },
              "whisper_source_expected": whisper_source_expected,
              "whisper_source_actual": whisper_source_actual,
              "model_revision": install["revision"],
              "model_sha256": model_sha256,
              "model_bytes": model_bytes,
              "pipeline_metrics": pipeline,
              "test_audio_path": str(corpus_wav),
              "test_audio_sha256": corpus_sha256,
              "install_report": install,
              "transcribe_report": transcribe,
          }
          (root / "whisper-real-cpu-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )

          print("## Whisper real CPU acceptance")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Whisper real CPU acceptance\n\n")
              out.write(f"Repository SHA: `{repository_sha}`  \n")
              out.write(f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`  \n")
              out.write(f"whisper.cpp source: `{whisper_source_actual}`  \n")
              out.write(f"Model revision: `{install['revision']}`  \n\n")
              out.write(
                  "| Model | Model revision | SHA256 | Bytes | Duration (ms) | "
                  "No-speech | Segments | Text | Network denied |\n"
              )
              out.write("| --- | --- | ---: | ---: | ---: | ---: | ---: | --- | --- |\n")
              out.write(
                  f"| whisper-small | {install['revision']} | "
                  f"{install['sha256'][:16]}... | {install['installed_bytes']} | "
                  f"{transcribe['transcript']['duration_ms']} | "
                  f"{transcribe['transcript']['no_speech_prob']:.3f} | "
                  f"{transcribe['transcript']['num_segments']} | "
                  f"{transcribe['transcript']['text']} | yes |\n"
              )
              out.write("\n## Production pipeline\n\n")
              out.write(
                  "| Partial (ms) | Final (ms) | RTF | Nominal drops | "
                  "Overload drops | Queue | Partial interval | Endpoint silence | Max utterance |\n"
              )
              out.write("| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n")
              out.write(
                  f"| {pipeline['first_partial_latency_ms']} | "
                  f"{pipeline['first_final_latency_ms']} | "
                  f"{float(pipeline['real_time_factor']):.3f} | "
                  f"{pipeline['nominal_dropped_chunks']} | "
                  f"{pipeline['overload_dropped_chunks']} | "
                  f"{pipeline['queue_capacity_chunks']} | "
                  f"{pipeline['partial_interval_samples']} | "
                  f"{pipeline['endpoint_silence_samples']} | "
                  f"{pipeline['maximum_utterance_samples']} |\n"
              )
              out.write("\n## Process resources\n\n")
              out.write(
                  "| Phase wall (ms) | CPU time (ms) | CPU usage (%) | "
                  "RSS (bytes) | Peak RSS (bytes) |\n"
              )
              out.write("| ---: | ---: | ---: | ---: | ---: |\n")
              out.write(
                  f"| {transcribe.get('phase_wall_ms')} | "
                  f"{transcribe.get('process_cpu_time_ms')} | {resource_usage:.2f} | "
                  f"{transcribe.get('resident_memory_bytes')} | "
                  f"{transcribe.get('peak_resident_memory_bytes')} |\n"
              )
          PY

      - name: Upload real-model acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-real-cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/talking-moose-whisper-acceptance/reports/*
          if-no-files-found: warn
          retention-days: 30

      - name: Show bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          report_root="$RUNNER_TEMP/talking-moose-whisper-acceptance/reports"
          if [[ -d "$report_root" ]]; then
            for log in "$report_root"/*.log; do
              [[ -f "$log" ]] || continue
              echo "--- ${log##*/} (last 80 lines) ---"
              tail -n 80 "$log"
            done
          fi
