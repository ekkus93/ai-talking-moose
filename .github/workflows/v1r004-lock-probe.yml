name: V1R-004 CPAL lock probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve CPAL 0.17 lockfile
        run: cargo update --manifest-path src-tauri/Cargo.toml -p cpal --precise 0.17.3

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v1r004-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
