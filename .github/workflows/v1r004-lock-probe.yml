name: V1R-004 CPAL lock probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve CPAL 0.17 lockfile
        run: cargo update --manifest-path src-tauri/Cargo.toml -p cpal --precise 0.17.3

      - name: Commit resolved lockfile to probe branch
        env:
          PROBE_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already resolved."
            exit 0
          fi
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add src-tauri/Cargo.lock
          git commit -m "probe: resolve CPAL 0.17 lockfile"
          git push origin "HEAD:${PROBE_BRANCH}"

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v1r004-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
