name: V1R-004 CPAL lock probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve CPAL 0.17 lockfile
        run: cargo update --manifest-path src-tauri/Cargo.toml -p cpal --precise 0.17.3

      - name: Apply V1R-004 source migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count == 1:
                  file_path.write_text(text.replace(old, new, 1))
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"{path}: expected exactly one migration target, found {count}")

          safe_stream = '''pub struct SafeStream(pub cpal::Stream);\n\n// SAFETY: CPAL intentionally makes its cross-platform `Stream` wrapper !Send because\n// Android's AAudio stream API is not thread-safe. Talking Moose V1 supports macOS and\n// Linux desktop builds only; CPAL's CoreAudio/ALSA stream handles may be moved between\n// threads, and this wrapper is only accessed through exclusive ownership or a mutex.\n#[cfg(any(target_os = "macos", target_os = "linux"))]\nunsafe impl Send for SafeStream {}\n\n'''

          for path in (
              "src-tauri/src/audio/capture.rs",
              "src-tauri/src/audio/playback.rs",
          ):
              replace_once(path, safe_stream, "")

          replace_once(
              "src-tauri/src/audio/capture.rs",
              "    _stream: Option<SafeStream>,",
              "    _stream: Option<cpal::Stream>,",
          )
          replace_once(
              "src-tauri/src/audio/capture.rs",
              "        let sample_rate = stream_config.sample_rate.0;",
              "        let sample_rate = stream_config.sample_rate;",
          )
          replace_once(
              "src-tauri/src/audio/capture.rs",
              "        self._stream = Some(SafeStream(stream));",
              "        self._stream = Some(stream);",
          )

          replace_once(
              "src-tauri/src/audio/playback.rs",
              "    _stream: Mutex<Option<SafeStream>> ,",
              "    _stream: Mutex<Option<cpal::Stream>> ,",
          ) if False else None
          replace_once(
              "src-tauri/src/audio/playback.rs",
              "    _stream: Mutex<Option<SafeStream>> ,".replace(">> ,", ">>,"),
              "    _stream: Mutex<Option<cpal::Stream>> ,".replace(">> ,", ">>,"),
          )
          replace_once(
              "src-tauri/src/audio/playback.rs",
              "        let sample_rate_hz = stream_config.sample_rate.0;",
              "        let sample_rate_hz = stream_config.sample_rate;",
          )
          replace_once(
              "src-tauri/src/audio/playback.rs",
              "        *self._stream.lock() = Some(SafeStream(stream));",
              "        *self._stream.lock() = Some(stream);",
          )
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit resolved migration to probe branch
        env:
          PROBE_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock src-tauri/src/audio/capture.rs src-tauri/src/audio/playback.rs; then
            echo "V1R-004 probe files are already resolved."
            exit 0
          fi
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add src-tauri/Cargo.lock src-tauri/src/audio/capture.rs src-tauri/src/audio/playback.rs
          git commit -m "probe: compile CPAL 0.17 migration"
          git push origin "HEAD:${PROBE_BRANCH}"

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v1r004-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
