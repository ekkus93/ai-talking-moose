name: Ralph Wake UI Lifecycle

on:
  push:
    branches:
      - ralph/wake-word-v1-core
    paths:
      - .github/workflows/ralph-wake-ui-lifecycle.yml
      - .github/ralph/wake_ui_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/wake-word-v1-core
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 .github/ralph/wake_ui_patch.py
      - name: Format and publish patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format:write
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/ralph-wake-ui-inventory.yml
          rm .github/workflows/ralph-wake-ui-lifecycle.yml
          rm .github/ralph/wake_ui_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src src-tauri/src .github/workflows/ralph-wake-ui-inventory.yml .github/workflows/ralph-wake-ui-lifecycle.yml .github/ralph/wake_ui_patch.py
          git commit -m "feat: add wake word settings and diagnostics UI"
          git push origin HEAD:ralph/wake-word-v1-core
