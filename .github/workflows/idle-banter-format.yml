name: Idle Banter branch formatter

on:
  push:
    branches:
      - ralph/idle-banter-implementation
    paths:
      - .github/idle-banter-format/READY

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ralph/idle-banter-implementation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Format Idle Banter frontend files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write src/components/Settings/BehaviorTab.tsx src/test/IdleBanterSettings.test.tsx
          rm -rf .github/idle-banter-format
          rm -f .github/workflows/idle-banter-format.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Idle Banter frontend"
          git push origin HEAD:ralph/idle-banter-implementation
