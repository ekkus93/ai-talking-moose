name: LLM-003 proof lock bootstrap

on:
  push:
    branches:
      - ralph/local-llm-llm003-20260831

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out LLM-003 branch
        uses: actions/checkout@v7
        with:
          ref: ralph/local-llm-llm003-20260831

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate isolated proof lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/llama-compile-proof/Cargo.toml

      - name: Commit proof lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/llama-compile-proof/Cargo.lock
          if git diff --cached --quiet; then
            echo "Proof Cargo.lock is already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "build: lock isolated llama.cpp proof"
          git push origin HEAD:ralph/local-llm-llm003-20260831
